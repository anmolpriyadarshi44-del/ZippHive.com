<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#053E40" />
<title>ZippHive Technician</title>
<link rel="icon" href="/zh-icon.png" />
<script src="/zipphive-config.js?v=13"></script>
<script src="/zh-qr.js?v=13"></script>
<link rel="stylesheet" href="/zh-ops.css?v=13" />
<style>
.wrap{max-width:640px}
.req{border:2px solid var(--y);background:#FFFDF5;box-shadow:0 6px 20px rgba(255,199,44,.18)}
.req .tag{display:inline-flex;align-items:center;gap:6px;background:var(--y);color:var(--deep);font-weight:800;font-size:12.5px;padding:3px 10px;border-radius:999px}
.req h2{margin:10px 0 4px;font-size:19px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.reasons button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px}
.reasons button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.job h2{margin:8px 0 4px}
.sharing{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--dark);font-weight:600}
.sharing i{width:9px;height:9px;border-radius:50%;background:#16B87A;animation:pulse 1.8s infinite;box-shadow:0 0 0 0 rgba(22,184,122,.6)}
.sec{margin:20px 0 10px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hello .av{width:46px;height:46px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.hello .av img{width:100%;height:100%;object-fit:cover}
/* steps strip */
.flow{display:flex;gap:4px;margin:12px 0 4px}
.flow span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-top:6px;border-top:4px solid var(--line)}
.flow span.done{border-color:var(--teal);color:var(--teal)}
.flow span.now{border-color:var(--y);color:var(--deep)}
/* QC form */
.panel{margin-top:12px;border:2px solid var(--teal);border-radius:14px;padding:12px;background:#FBFEFE}
.panel h3{margin:0 0 2px}
.prog{font-size:13px;color:var(--muted);margin-bottom:8px}
.prog b{color:var(--deep)}
.prog .bad{color:var(--red);font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.qrow{padding:9px 0;border-top:1px solid var(--line)}
.qrow .lab{font-weight:600;font-size:14.5px}
.qrow .was{font-size:12px;color:var(--muted);margin-top:1px}
.qrow .was.bad{color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.seg button{min-height:40px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.seg button.ok.on{background:var(--green);border-color:var(--green);color:#fff}
.seg button.fault.on{background:var(--red);border-color:var(--red);color:#fff}
.seg button.na.on{background:#777;border-color:#777;color:#fff}
.qrow .in{margin-top:6px;min-height:38px}
.qrow.isbad{background:#FFF7F7;margin:0 -12px;padding:9px 12px}
.addnote{background:none;border:0;color:var(--teal);font-size:12.5px;font-weight:600;padding:4px 0 0;cursor:pointer}
textarea.in{min-height:64px;resize:vertical}
.paybox .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.paybox .modes button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.paybox .modes button.on{background:var(--deep);border-color:var(--deep);color:#fff}
.paybox label{display:block;font-weight:600;font-size:13.5px;margin-top:8px}
.qrbox{text-align:center;margin:10px 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qrbox svg{width:200px;height:200px}
.due{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.due b{font-family:Poppins,system-ui,sans-serif;font-size:24px;color:var(--deep)}
.wbanner{background:#E8F5F4;border-left:4px solid var(--teal);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--dark);margin:8px 0}
.paybox .modes.disc button{font-size:13.5px}
.due.payable{margin-top:14px;padding:12px 14px;border-radius:12px;background:#FFF6D9}
.due.payable span{font-weight:700}
.wtag{display:inline-block;background:#053E40;color:#FFC72C;font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px}
.wphoto{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.donebox{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--greenlt);color:var(--green);font-weight:600;font-size:14px}
.donebox.bad{background:var(--redlt);color:var(--red)}
.donebox .row{margin-top:6px}
details.remarks{margin-top:12px}
details.remarks summary{cursor:pointer;font-weight:600;color:var(--teal);font-size:14px}
</style>
</head>
<body>
<div id="app"><div class="center muted">Loading…</div></div>
<script type="module">
import { invoiceUrl, backend, STATUS, CLOSED, actions, waLink, ago, when, esc, toast, newQc, qcSum, qcCompare, PAY_MODES, rupees, upiLink, qrSvg, cfg, payInfo, isWarranty, reviewUrl, warrantyInfo } from "/zh-ops.js?v=13";

const REASONS = ["Busy on another job", "Too far away", "Not my skill", "Off duty", "Part not available"];
const S = { be: undefined, user: undefined, me: undefined, jobs: [], declining: null, reason: "", other: "", busy: {}, qc: {}, pay: {}, notes: {}, rem: {} };
const app = document.getElementById("app");
const watchers = new Map();
const timers = {};
let seen = null, unsub = null, audio = null;

const isReq = (j) => j.assignState === "pending";
const debounce = (key, fn, ms = 700) => { clearTimeout(timers[key]); timers[key] = setTimeout(fn, ms); };

// ---- live location (sends on move > 25 m or every 20 s) ----
function startShare(j) {
  if (watchers.has(j.id) || !navigator.geolocation) return;
  const w = { id: null, last: null, wake: null, err: "" };
  watchers.set(j.id, w);
  navigator.wakeLock?.request("screen").then((l) => (w.wake = l)).catch(() => {});
  w.id = navigator.geolocation.watchPosition(
    (p) => {
      const { latitude: lat, longitude: lng, accuracy } = p.coords, t = Date.now(), l = w.last;
      const moved = !l || Math.hypot((lat - l.lat) * 111e3, (lng - l.lng) * 98e3) > 25;
      if (!l || moved || t - l.t > 2e4) {
        w.last = { lat, lng, t };
        S.be.updateBooking(j.id, { techLoc: { lat, lng, acc: Math.round(accuracy), at: t } }).catch(() => {});
      }
      if (w.err) { w.err = ""; render(); }
    },
    (e) => { w.err = e.code === 1 ? "Location permission denied – allow location for this site in your browser settings." : "Could not get location: " + e.message; render(); },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}
function stopShare(id) {
  const w = watchers.get(id);
  if (!w) return;
  if (w.id != null) navigator.geolocation.clearWatch(w.id);
  w.wake?.release().catch(() => {});
  watchers.delete(id);
}
function syncSharing() {
  const live = new Set(S.jobs.filter((j) => ["on_the_way", "arrived"].includes(j.status) && !isReq(j)).map((j) => j.id));
  for (const id of [...watchers.keys()]) if (!live.has(id)) stopShare(id);
  for (const j of S.jobs) if (live.has(j.id)) startShare(j);
}

// ---- new request alert ----
function alertNew(list) {
  const ids = list.filter(isReq).map((j) => j.id);
  if (seen && ids.some((id) => !seen.has(id))) {
    navigator.vibrate?.([250, 120, 250, 120, 250]);
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25].forEach((d) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.25, audio.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + d + 0.2);
        o.start(audio.currentTime + d); o.stop(audio.currentTime + d + 0.22);
      });
    } catch {}
  }
  seen = new Set(ids);
  document.title = ids.length ? `(${ids.length}) New job request – ZippHive` : "ZippHive Technician";
}

// ---- QC drafts: local copy is the source of truth while editing, saved to the server live ----
const getQc = (j, w) => S.qc[j.id]?.[w] ?? j[w] ?? null;
function setQc(j, w, qc, now) {
  (S.qc[j.id] ||= {})[w] = qc;
  // always save the latest draft, so a delayed save can't overwrite a newer one (e.g. after Submit)
  const save = () => actions.saveQc(S.be, j, w, S.qc[j.id][w]).catch((e) => toast("Could not save check: " + (e.message || e), true));
  if (now) { clearTimeout(timers[j.id + w]); save(); } else debounce(j.id + w, save);
}
// Payment draft: total charge, optional discount (₹ or 100%), what the customer pays, how they paid
// warranty jobs: free only once the store manager approves; "not covered" → normal charge
const wCovered = (j) => isWarranty(j) && warrantyInfo(j).state !== "rejected";
const getPay = (j) => {
  const ws = isWarranty(j) ? warrantyInfo(j).state : "";
  if (S.pay[j.id] && S.pay[j.id]._ws === ws) return S.pay[j.id];
  return (S.pay[j.id] = ws === "approved"
    ? { _ws: ws, charge: "0", disc: "full", discount: "", reason: "Covered under warranty", mode: "UPI", ref: "", note: "" }
    : { _ws: ws, charge: j.price ? String(j.price) : "", disc: "none", discount: "", reason: "", mode: "UPI", ref: "", note: "" });
};
// banner on a warranty job showing the store manager's decision
function wDecision(j) {
  const wi = warrantyInfo(j);
  if (!wi) return "";
  if (wi.state === "approved") return `<div class="wbanner" style="background:#E6F4EA;border-color:#1E8E3E">✅ Warranty approved by store${wi.by ? ` (${esc(wi.by)})` : ""} – repair is free for the customer.${wi.defect ? `<br><span class="muted">Defect: ${esc(wi.defect)}</span>` : ""}</div>`;
  if (wi.state === "rejected") return `<div class="wbanner" style="background:#FDECEC;border-color:#C62828">❌ Not covered under warranty – ${esc(wi.reason)}. Share the normal repair price with the customer before starting.</div>`;
  return `<div class="wbanner" style="background:#FFF6D9;border-color:#E8A317">⏳ Waiting for the store manager to confirm warranty. Do the pre-repair check carefully – write exactly what is faulty; the store decides from it.</div>`;
}
const num = (v) => Number(String(v ?? "").replace(/[^\d.]/g, "")) || 0;
function payCalc(j, p) {
  const charge = num(p.charge);
  const discount = p.disc === "full" ? charge : p.disc === "amount" ? Math.min(num(p.discount), charge) : 0;
  const payable = Math.max(0, charge - discount);
  const quoted = j.price != null ? Number(j.price) : null;
  const needReason = p.disc !== "none" || (!isWarranty(j) && quoted != null && p.charge !== "" && charge !== quoted);
  return { charge, discount, payable, needReason };
}

function reqCard(j) {
  const dec = S.declining === j.id;
  return `<div class="card req">
    <span class="tag">⚡ New job request · ${ago(j.offeredAt)}</span> ${isWarranty(j) ? `<span class="wtag">🛡️ WARRANTY</span>` : ""}
    <h2>${j.device ? esc(j.device) + " – " : ""}${esc(j.item || j.service)}</h2>
    ${j.problem ? `<p class="muted" style="margin:0">${esc(j.problem)}</p>` : ""}
    <dl class="kv">
      <dt>Area</dt><dd>${esc(j.area)}, Patna</dd>
      <dt>Time</dt><dd>${esc(j.time)}</dd>
      ${j.price ? `<dt>Price</dt><dd>${rupees(j.price)}</dd>` : isWarranty(j) ? `<dt>Charge</dt><dd>Free if covered</dd>` : ""}
      ${isWarranty(j) && j.warranty?.repairDate ? `<dt>Repaired</dt><dd>${esc(j.warranty.repairDate)}${j.warranty.technician ? " by " + esc(j.warranty.technician) : ""}</dd>` : ""}
      <dt>Booking</dt><dd>${esc(j.code)}</dd>
      ${j.note ? `<dt>Note</dt><dd>${esc(j.note)}</dd>` : ""}
    </dl>
    ${dec ? `
      <b>Why can't you take it?</b>
      <div class="reasons">${REASONS.map((r) => `<button class="${S.reason === r ? "on" : ""}" data-act="reason" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <input class="in" id="other" placeholder="Other reason (optional)" value="${esc(S.other)}">
      <div class="two"><button class="btn g big" data-act="back">Back</button><button class="btn r big" data-act="decline-yes" data-id="${j.id}" ${S.busy[j.id] ? "disabled" : ""}>Decline job</button></div>`
    : `<div class="two"><button class="btn o big" data-act="decline" data-id="${j.id}">Decline</button><button class="btn y big" data-act="accept" data-id="${j.id}" ${S.busy[j.id] ? "disabled" : ""}>✅ Accept job</button></div>
       <p class="muted" style="margin:8px 0 0;text-align:center">Customer's contact details appear after you accept.</p>`}
  </div>`;
}

function qcPanel(j, w) {
  const qc = getQc(j, w), s = qcSum(qc), pre = w === "postQc" ? getQc(j, "preQc") : null;
  const title = w === "preQc" ? "Pre-repair check" : "Post-repair check";
  const help = w === "preQc" ? "Test every function <b>before</b> you open the device. Mark anything not working and write what you see." : "Test every function again <b>after</b> the repair.";
  const preMap = Object.fromEntries((pre?.items || []).map((i) => [i.k, i]));
  const rows = qc.items.map((it, n) => {
    const was = preMap[it.k];
    const showNote = it.s === "fault" || it.r || S.notes[j.id + w + it.k];
    return `<div class="qrow ${it.s === "fault" ? "isbad" : ""}">
      <div class="lab">${esc(it.l)}</div>
      ${was ? `<div class="was ${was.s === "fault" ? "bad" : ""}">Before: ${was.s === "ok" ? "OK" : was.s === "fault" ? "Not OK" : was.s === "na" ? "N/A" : "—"}${was.r ? " · " + esc(was.r) : ""}</div>` : ""}
      <div class="seg" role="group" aria-label="${esc(it.l)}">
        <button class="ok ${it.s === "ok" ? "on" : ""}" data-act="qc" data-id="${j.id}" data-w="${w}" data-n="${n}" data-s="ok">✓ OK</button>
        <button class="fault ${it.s === "fault" ? "on" : ""}" data-act="qc" data-id="${j.id}" data-w="${w}" data-n="${n}" data-s="fault">✕ Not OK</button>
        <button class="na ${it.s === "na" ? "on" : ""}" data-act="qc" data-id="${j.id}" data-w="${w}" data-n="${n}" data-s="na">N/A</button>
      </div>
      ${showNote ? `<input class="in" id="qr-${j.id}-${w}-${n}" data-qcr="${n}" data-id="${j.id}" data-w="${w}" placeholder="${it.s === "fault" ? "What's wrong? (required)" : "Remark"}" value="${esc(it.r)}">`
        : `<button class="addnote" data-act="note" data-id="${j.id}" data-w="${w}" data-k="${esc(it.k)}">+ Add remark</button>`}
    </div>`;
  }).join("");
  return `<div class="panel">
    <h3>${title}</h3>
    <div class="prog"><b>${s.checked}/${s.total}</b> checked${s.fault ? ` · <span class="bad">${s.fault} not OK</span>` : ""}${s.na ? ` · ${s.na} N/A` : ""}</div>
    <p class="muted" style="margin:0 0 8px">${help}</p>
    <div class="quick">
      <button class="btn sm g" data-act="qc-rest" data-id="${j.id}" data-w="${w}" data-s="ok">Mark remaining OK</button>
      ${w === "preQc" ? `<button class="btn sm g" data-act="qc-rest" data-id="${j.id}" data-w="${w}" data-s="na">Device dead – rest N/A</button>` : ""}
    </div>
    ${rows}
    <label class="muted" style="display:block;margin-top:10px;font-weight:600">Overall remarks ${w === "preQc" ? "(scratches, dents, missing parts, customer's complaint…)" : "(what was replaced, anything the customer should know)"}</label>
    <textarea class="in" id="qcrem-${j.id}-${w}" data-qcrem="1" data-id="${j.id}" data-w="${w}" placeholder="Write here…">${esc(qc.remark || "")}</textarea>
    <button class="btn y big" style="margin-top:10px" data-act="qc-submit" data-id="${j.id}" data-w="${w}">${w === "preQc" ? "Submit pre-repair check" : "Submit post-repair check"}</button>
  </div>`;
}

function payPanel(j) {
  const p = getPay(j), c = payCalc(j, p), W = isWarranty(j);
  const upi = c.payable > 0 && p.mode === "UPI" ? upiLink(c.payable, j.code) : "";
  const chip = (v, label) => `<button class="${p.disc === v ? "on" : ""}" data-act="disc" data-id="${j.id}" data-v="${v}">${label}</button>`;
  return `<div class="panel paybox">
    <h3>${wCovered(j) ? "Close warranty job" : "Collect payment"}</h3>
    ${W ? (warrantyInfo(j).state === "rejected" ? `<div class="wbanner" style="background:#FDECEC;border-color:#C62828">Not covered under warranty – enter the normal repair charge you agreed with the customer.</div>` : `<div class="wbanner">🛡️ Warranty job — if covered, the customer pays nothing. Enter the part / service value if you want it shown on the invoice.</div>`) : `<div class="due"><span class="muted">Quoted price</span><b>${rupees(j.price)}</b></div>`}
    <label for="chg-${j.id}">${wCovered(j) ? "Repair value (₹)" : "Total charge (₹)"}</label>
    <input class="in" id="chg-${j.id}" data-pay="charge" data-id="${j.id}" inputmode="numeric" value="${esc(p.charge)}">
    <label>Discount</label>
    <div class="modes disc">${chip("none", "No discount")}${chip("amount", "₹ Discount")}${chip("full", wCovered(j) ? "🛡️ Warranty – free" : "100% free")}</div>
    ${p.disc === "amount" ? `<label for="dsc-${j.id}">Discount amount (₹)</label><input class="in" id="dsc-${j.id}" data-pay="discount" data-id="${j.id}" inputmode="numeric" value="${esc(p.discount)}">` : ""}
    ${c.needReason ? `<label for="rsn-${j.id}">Reason (required)</label><input class="in" id="rsn-${j.id}" data-pay="reason" data-id="${j.id}" placeholder="${p.disc !== "none" ? "e.g. covered under warranty / loyal customer" : "e.g. extra part – back glass ₹500"}" value="${esc(p.reason)}">` : ""}
    <div class="due payable"><span>Customer pays</span><b>${rupees(c.payable)}</b></div>
    ${c.discount ? `<div class="muted" style="text-align:right">${rupees(c.charge)} − ${p.disc === "full" ? (wCovered(j) ? "warranty cover" : "100% discount") : "discount"} ${rupees(c.discount)}</div>` : ""}
    ${c.payable > 0 ? `
      <div class="modes">${PAY_MODES.map((m) => `<button class="${p.mode === m ? "on" : ""}" data-act="mode" data-id="${j.id}" data-m="${m}">${m === "UPI" ? "📱 UPI" : m === "Cash" ? "💵 Cash" : "💳 Card"}</button>`).join("")}</div>
      ${upi ? `<div class="qrbox">${qrSvg(upi)}<div class="muted">Customer scans to pay ${rupees(c.payable)} to ${esc(cfg().upiId)}</div><a class="btn sm o" style="margin-top:6px" href="${esc(upi)}">Open UPI app</a></div>` : ""}
      ${p.mode !== "Cash" ? `<label for="ref-${j.id}">${p.mode === "UPI" ? "UPI reference / last 4 digits of UTR" : "Card slip / last 4 digits"} (optional)</label>
      <input class="in" id="ref-${j.id}" data-pay="ref" data-id="${j.id}" value="${esc(p.ref)}">` : ""}
      <button class="btn y big" style="margin-top:12px" data-act="paid" data-id="${j.id}" ${S.busy[j.id] ? "disabled" : ""}>✅ Payment received ${rupees(c.payable)}</button>
      <label for="pnote-${j.id}" style="margin-top:14px">Couldn't collect? Write why</label>
      <input class="in" id="pnote-${j.id}" data-pay="note" data-id="${j.id}" placeholder="e.g. customer will pay by UPI tonight" value="${esc(p.note)}">
      <button class="btn link" style="display:block;margin:8px auto 0" data-act="unpaid" data-id="${j.id}">Customer couldn't pay now</button>`
    : `<button class="btn y big" style="margin-top:12px" data-act="paid" data-id="${j.id}" ${S.busy[j.id] ? "disabled" : ""}>✅ Confirm — no payment needed</button>
      <p class="muted" style="text-align:center;margin:8px 0 0">The invoice will show ₹0 ${wCovered(j) ? "(covered under warranty)" : "(100% discount)"}.</p>`}
  </div>`;
}

const FLOW_LABELS = [["Trip", ["on_the_way"]], ["Pre-check", ["arrived"]], ["Repair", ["in_progress:repair"]], ["Post-check", ["in_progress:post"]], ["Payment", ["in_progress:pay"]], ["Done", ["completed"]]];
function phaseKey(j) {
  if (j.status === "assigned") return 0;
  if (j.status === "on_the_way") return 0;
  if (j.status === "arrived") return 1;
  if (j.status === "in_progress") { const post = getQc(j, "postQc"); return !post ? 2 : !post.doneAt ? 3 : !j.payment ? 4 : 5; }
  return 6;
}

function jobCard(j) {
  const w = watchers.get(j.id), k = phaseKey(j);
  const pre = getQc(j, "preQc"), post = getQc(j, "postQc");
  const busy = S.busy[j.id] ? "disabled" : "";
  let action = "";
  if (j.status === "assigned") action = `<button class="btn y big" style="margin-top:12px" data-act="step" data-id="${j.id}" data-to="on_the_way" ${busy}>🛵 Start trip (share live location)</button>`;
  else if (j.status === "on_the_way") action = `<button class="btn y big" style="margin-top:12px" data-act="step" data-id="${j.id}" data-to="arrived" ${busy}>📍 I have arrived</button>`;
  else if (j.status === "arrived") {
    if (!pre) action = `<button class="btn y big" style="margin-top:12px" data-act="qc-start" data-id="${j.id}" data-w="preQc">🔍 Start pre-repair check</button>`;
    else if (!pre.doneAt) action = qcPanel(j, "preQc");
    else action = `<div class="donebox">✓ Pre-repair check done · ${qcSum(pre).fault} not OK <button class="btn link" data-act="qc-edit" data-id="${j.id}" data-w="preQc">Edit</button></div>
      <button class="btn y big" style="margin-top:12px" data-act="step" data-id="${j.id}" data-to="in_progress" ${busy}>🛠️ Start repair</button>`;
  } else if (j.status === "in_progress") {
    if (!post) action = `<div class="donebox">✓ Pre-repair check done</div><button class="btn y big" style="margin-top:12px" data-act="qc-start" data-id="${j.id}" data-w="postQc">🔍 Repair finished – start post-repair check</button>`;
    else if (!post.doneAt) action = qcPanel(j, "postQc");
    else {
      const cmp = qcCompare(pre, post);
      const qcLine = `<div class="donebox ${cmp.newIssues.length ? "bad" : ""}">✓ Post-repair check done${cmp.newIssues.length ? ` · ⚠ ${cmp.newIssues.length} item(s) not OK that were OK before` : qcSum(post).fault ? ` · ${qcSum(post).fault} not OK` : " · all OK"} <button class="btn link" data-act="qc-edit" data-id="${j.id}" data-w="postQc">Edit</button></div>`;
      if (!j.payment) action = qcLine + payPanel(j);
      else {
        const p = payInfo(j);
        const receipt = `Hi ${j.name}, thank you for choosing ZippHive! ✅\nBooking ${j.code}: ${j.device ? j.device + " – " : ""}${j.item || j.service}\n${p.state === "free" ? (wCovered(j) ? "No charge – covered under warranty" : "No charge – 100% discount") : `Paid: ${rupees(p.amount)} via ${p.mode}${p.ref ? ` (Ref ${p.ref})` : ""}${p.discount ? ` (discount ${rupees(p.discount)})` : ""}`}\nTechnician: ${S.me.name}\n\nYour invoice & quality check report: ${invoiceUrl(j.id)}${reviewUrl() ? `\n\nHappy with the service? Please rate us on Google ⭐ ${reviewUrl()}` : ""}`;
        action = qcLine + (p.state !== "unpaid"
          ? `<div class="donebox">${p.state === "free" ? `🛡️ ${esc(p.label)}` : `💰 ${rupees(p.amount)} received via ${esc(p.mode)}${p.ref ? ` · Ref ${esc(p.ref)}` : ""}${p.discount ? ` · discount ${rupees(p.discount)}` : ""}`}
              <div class="row"><a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(j.mobile, receipt)}">Send invoice on WhatsApp</a><button class="btn link" data-act="pay-edit" data-id="${j.id}">Edit</button></div></div>`
          : `<div class="donebox bad">Payment not collected${p.note ? ` — ${esc(p.note)}` : ""} <button class="btn link" data-act="pay-edit" data-id="${j.id}">Edit</button></div>`)
          + `<button class="btn y big" style="margin-top:12px" data-act="step" data-id="${j.id}" data-to="completed" ${busy}>✅ Job completed</button>`;
      }
    }
  }
  const remVal = S.rem[j.id] ?? j.techRemarks ?? "";
  return `<div class="card job">
    <div class="row" style="justify-content:space-between"><span><b>${esc(j.code)}</b> ${isWarranty(j) ? `<span class="wtag">🛡️ WARRANTY</span>` : ""}</span><span class="pill ${esc(j.status)}">${esc(STATUS[j.status] || j.status)}</span></div>
    <h2>${j.device ? esc(j.device) + " – " : ""}${esc(j.item || j.service)}</h2>
    ${j.problem ? `<p class="muted" style="margin:0">${esc(j.problem)}</p>` : ""}
    ${isWarranty(j) ? `<div class="wbanner" style="display:flex;gap:10px;align-items:center">${j.warranty?.photo ? `<a href="${esc(j.warranty.photo)}" target="_blank" rel="noopener"><img class="wphoto" src="${esc(j.warranty.photo)}" alt="Customer photo"></a>` : ""}<span>Claim ${esc(j.warranty?.claimId || "")}${j.warranty?.invoiceNo || j.warranty?.origCode ? ` · original ${esc(j.warranty.invoiceNo || j.warranty.origCode)}` : ""}${j.warranty?.repairDate ? ` · repaired ${esc(j.warranty.repairDate)}` : ""}${j.warranty?.technician ? ` by ${esc(j.warranty.technician)}` : ""}${j.warranty?.origBookingId ? `<br><a href="${invoiceUrl(j.warranty.origBookingId)}" target="_blank" rel="noopener">Open original invoice & QC report →</a>` : ""}</span></div>${j.payment ? "" : wDecision(j)}` : ""}
    <p style="margin:8px 0"><b>${esc(j.name)}</b> · ${esc(j.area)}, Patna · ${esc(j.time)}${j.price ? ` · ${rupees(j.price)}` : ""}</p>
    ${j.note ? `<p class="muted">Note: ${esc(j.note)}</p>` : ""}
    <div class="row">
      <a class="btn sm o" href="tel:+91${esc(j.mobile)}">📞 Call customer</a>
      <a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(j.mobile, `Hi ${j.name}, I'm your ZippHive technician for booking ${j.code}.`)}">WhatsApp</a>
      <a class="btn sm g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent(`${j.area}, Patna`)}">🗺️ Map</a>
    </div>
    <div class="flow" aria-hidden="true">${FLOW_LABELS.map(([l], i) => `<span class="${i < k ? "done" : i === k ? "now" : ""}">${l}</span>`).join("")}</div>
    ${action}
    ${w ? `<div class="sharing"><i></i>Sharing live location${j.techLoc ? ` · updated ${ago(j.techLoc.at)}` : ""} – keep this page open</div>` : ""}
    ${w && w.err ? `<p style="color:var(--red)">${esc(w.err)}</p>` : ""}
    <details class="remarks" ${remVal ? "open" : ""}><summary>📝 Job remarks for the store</summary>
      <textarea class="in" style="margin-top:6px" id="trm-${j.id}" data-trm="${j.id}" placeholder="Anything abnormal — extra part needed, customer request, device condition…">${esc(remVal)}</textarea>
      <div class="muted">Saved automatically · the store manager sees this live</div></details>
  </div>`;
}

function render() {
  const a = document.activeElement, fid = a && a.id;
  const sel = a && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
  const top = (right = "") => `<header class="top"><span class="brand">Zipp<span>Hive</span></span><span class="role">Technician</span><span class="sp"></span>${right}</header>`;
  const out = `<button class="btn sm ghost" data-act="signout">Sign out</button>`;
  const openDetails = [...app.querySelectorAll("details.remarks")].map((d) => [d.querySelector("textarea")?.id, d.open]);
  if (S.be === undefined || S.user === undefined) app.innerHTML = `<div class="center muted">Loading…</div>`;
  else if (S.be === null) app.innerHTML = `<div class="center"><div><h2>Not configured</h2></div></div>`;
  else if (!S.user) app.innerHTML = top() + `<div class="card login"><h2>Technician sign-in</h2><p class="muted">Sign in with the Google account ZippHive registered for you.</p><button class="btn" data-act="signin">Sign in with Google</button></div>`;
  else if (S.me === undefined) app.innerHTML = top(out) + `<div class="center muted">Loading…</div>`;
  else if (!S.me || S.me.active === false) app.innerHTML = top(out) + `<div class="card login"><h2>Not registered</h2><p class="muted">${esc(S.user.email)} is not an active ZippHive technician. Ask the store manager to add you.</p></div>`;
  else {
    const reqs = S.jobs.filter((j) => isReq(j) && !CLOSED.includes(j.status));
    const active = S.jobs.filter((j) => !isReq(j) && !CLOSED.includes(j.status));
    const done = S.jobs.filter((j) => j.status === "completed").slice(0, 10);
    app.innerHTML = top(out) + `<div class="wrap">
      <div class="hello"><div class="av">${S.me.photo ? `<img src="${esc(S.me.photo)}" alt="">` : "👨‍🔧"}</div><div><h1 style="margin:0">Hi ${esc((S.me.name || "").split(" ")[0])}</h1><span class="live" style="color:var(--teal)"><i></i>Online – new jobs appear here instantly</span></div></div>
      ${reqs.length ? `<div class="sec">Job requests (${reqs.length})</div>` + reqs.map(reqCard).join("") : ""}
      <div class="sec">My jobs</div>
      ${active.length ? active.map(jobCard).join("") : `<div class="card muted">No active jobs right now.</div>`}
      ${done.length ? `<div class="sec">Recently completed</div>` + done.map((j) => `<div class="card muted">${esc(j.code)} · ${esc(j.name)} · ${esc(j.item || j.service)} · ${j.payment ? esc(payInfo(j).label) + " · " : ""}${when(j.statusAt)}</div>`).join("") : ""}
    </div>`;
  }
  for (const [id, open] of openDetails) { const t = id && document.getElementById(id); if (t && open) t.closest("details").open = true; }
  if (fid) {
    const el = document.getElementById(fid);
    if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} }
  }
}

const find = (id) => S.jobs.find((j) => j.id === id);
async function act(id, p, ok) {
  S.busy[id] = true; render();
  try { await p; ok && toast(ok); } catch (e) { toast("Update failed: " + (e.message || e), true); }
  delete S.busy[id]; render();
}

app.addEventListener("click", (e) => {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume?.(); } catch {}
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, j = find(el.dataset.id), w = el.dataset.w;
  if (a === "signin") return S.be.signIn().catch((x) => toast("Sign-in failed: " + (x.message || x), true));
  if (a === "signout") return S.be.signOut();
  if (a === "decline") { S.declining = j.id; S.reason = ""; S.other = ""; return render(); }
  if (a === "back") { S.declining = null; return render(); }
  if (a === "reason") { S.reason = S.reason === el.dataset.r ? "" : el.dataset.r; return render(); }
  if (!j) return;
  if (a === "accept") return act(j.id, actions.accept(S.be, j, S.me), "Job accepted – the customer can now see you");
  if (a === "decline-yes") {
    const r = [S.reason, S.other.trim()].filter(Boolean).join(" – ");
    S.declining = null;
    return act(j.id, actions.decline(S.be, j, S.me, r), "Declined – the store manager will reassign it");
  }
  if (a === "step") {
    if (el.dataset.to === "completed" && !j.payment) return toast("Record the payment first", true);
    return act(j.id, actions.step(S.be, j, el.dataset.to), STATUS[el.dataset.to]);
  }
  // quality checks
  if (a === "qc-start") { setQc(j, w, newQc(j), true); render(); return toast(w === "preQc" ? "Pre-repair check started" : "Post-repair check started"); }
  if (a === "qc" || a === "qc-rest" || a === "note" || a === "qc-edit") {
    const qc = structuredClone(getQc(j, w));
    if (a === "qc") { const it = qc.items[+el.dataset.n]; it.s = it.s === el.dataset.s ? "" : el.dataset.s; }
    if (a === "qc-rest") qc.items.forEach((it) => { if (!it.s) it.s = el.dataset.s; });
    if (a === "note") { S.notes[j.id + w + el.dataset.k] = true; render(); return; }
    if (a === "qc-edit") qc.doneAt = 0;
    setQc(j, w, qc); render(); return;
  }
  if (a === "qc-submit") {
    const qc = structuredClone(getQc(j, w)), s = qcSum(qc);
    if (s.checked < s.total) return toast(`Check all items first (${s.total - s.checked} left)`, true);
    const missing = qc.items.filter((i) => i.s === "fault" && !i.r.trim());
    if (missing.length) return toast(`Write what's wrong for: ${missing.map((i) => i.l).join(", ")}`, true);
    qc.doneAt = Date.now(); qc.by = S.me.name;
    setQc(j, w, qc, true); render();
    return toast(w === "preQc" ? "Pre-repair check saved – you can start the repair" : "Post-repair check saved – collect payment");
  }
  // payments
  if (a === "mode") { getPay(j).mode = el.dataset.m; return render(); }
  if (a === "disc") {
    const p = getPay(j); p.disc = el.dataset.v;
    if (p.disc === "full" && !p.reason) p.reason = wCovered(j) ? "Covered under warranty" : "";
    if (p.disc === "none" && isWarranty(j) && p.reason === "Covered under warranty") p.reason = "";
    return render();
  }
  if (a === "paid" || a === "unpaid") {
    const p = getPay(j), c = payCalc(j, p);
    if (p.charge === "" ) return toast("Enter the total charge (0 if nothing to charge)", true);
    if (p.disc === "amount" && !num(p.discount)) return toast("Enter the discount amount", true);
    if (c.needReason && !p.reason.trim()) { document.getElementById("rsn-" + j.id)?.focus(); return toast("Write the reason for the discount / changed amount", true); }
    const base = { charge: c.charge, discount: c.discount, discountType: p.disc === "full" ? (wCovered(j) ? "warranty" : "full") : p.disc === "amount" ? "discount" : "", reason: p.reason.trim(), at: Date.now(), by: S.me.name };
    if (a === "paid") {
      const rec = c.payable > 0
        ? { ...base, status: "paid", amount: c.payable, mode: p.mode, ref: p.ref.trim(), note: p.reason.trim() }
        : { ...base, status: "free", amount: 0, mode: "", ref: "", note: p.reason.trim() };
      return act(j.id, actions.pay(S.be, j, rec), c.payable > 0 ? `${rupees(c.payable)} recorded` : "Recorded – no payment needed");
    }
    if (!p.note.trim()) { document.getElementById("pnote-" + j.id)?.focus(); return toast("Write why the payment couldn't be collected", true); }
    return act(j.id, actions.pay(S.be, j, { ...base, status: "not_collected", amount: 0, mode: "", ref: "", note: p.note.trim() }), "Marked as not collected – the store will follow up");
  }
  if (a === "pay-edit") {
    const p = j.payment || {};
    const disc = p.discountType === "warranty" || p.discountType === "full" ? "full" : p.discountType === "discount" ? "amount" : "none";
    S.pay[j.id] = { _ws: isWarranty(j) ? warrantyInfo(j).state : "", charge: String(p.charge ?? p.amount ?? j.price ?? ""), disc, discount: disc === "amount" ? String(p.discount || "") : "", reason: p.reason || (p.status === "paid" ? p.note || "" : ""), mode: p.mode || "UPI", ref: p.ref || "", note: p.status === "not_collected" ? p.note || "" : "" };
    return act(j.id, S.be.updateBooking(j.id, { payment: null }), "");
  }
});

app.addEventListener("input", (e) => {
  const t = e.target, d = t.dataset;
  if (t.id === "other") S.other = t.value;
  else if (d.qcr != null) {
    const j = find(d.id), qc = structuredClone(getQc(j, d.w));
    qc.items[+d.qcr].r = t.value; setQc(j, d.w, qc);
  } else if (d.qcrem) {
    const j = find(d.id), qc = structuredClone(getQc(j, d.w));
    qc.remark = t.value; setQc(j, d.w, qc);
  } else if (d.pay) {
    const j = find(d.id); getPay(j)[d.pay] = t.value;
    if (["charge", "discount", "reason"].includes(d.pay)) render();
  } else if (d.trm) {
    const j = find(d.trm); S.rem[j.id] = t.value;
    debounce("rem" + j.id, () => actions.saveRemarks(S.be, j, t.value).catch((x) => toast("Could not save remarks: " + (x.message || x), true)), 900);
  }
});
setInterval(() => S.me && !document.activeElement?.matches?.("input,textarea") && render(), 30000);

S.be = await backend();
render();
if (S.be) S.be.onUser(async (u) => {
  unsub && unsub(); unsub = null; seen = null;
  for (const id of [...watchers.keys()]) stopShare(id);
  S.user = u; S.me = undefined; S.jobs = [];
  render();
  if (!u) return;
  try { S.me = await S.be.getTech(u.email); } catch { S.me = null; }
  if (S.me && S.me.active !== false) {
    S.me = { ...S.me, email: u.email };
    unsub = S.be.watchJobs(u.email, (list) => {
      S.jobs = list;
      if (S.declining && !list.some((j) => j.id === S.declining && isReq(j))) S.declining = null;
      alertNew(list); syncSharing(); render();
    }, (err) => toast("Could not load jobs: " + (err.message || err), true));
  }
  render();
});
</script>
</body>
</html>
