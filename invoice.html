<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#053E40" />
<title>ZippHive Invoice</title>
<link rel="icon" href="/zh-icon.png" />
<script src="/zipphive-config.js?v=12"></script>
<style>
:root{--teal:#0B7F7D;--deep:#053E40;--y:#FFC72C;--ink:#0F2424;--muted:#5B6F6F;--line:#DCE8E7;--bg:#F5FAF9;--tint:#E8F5F4;--red:#C62828;--redlt:#FDECEC;--green:#1E8E3E;--greenlt:#E6F4EA;--wa:#1FAF54}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.45}
h1,h2,h3{font-family:Poppins,Inter,system-ui,sans-serif;color:var(--deep);margin:0}
.bar{max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;font-weight:600;text-decoration:none;border:2px solid transparent;background:var(--teal);color:#fff;cursor:pointer;font:inherit;font-weight:600}
.btn.o{background:#fff;color:var(--teal);border-color:var(--teal)}
.btn.wa{background:var(--wa)}
.doc{max-width:820px;margin:12px auto 32px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;position:relative;overflow:hidden}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:3px solid var(--deep)}
.brand{display:flex;gap:12px;align-items:center}
.brand img{width:46px;height:46px}
.brand h1{font-size:24px}.brand h1 span{color:#E0A800}
.brand small{display:block;color:var(--muted)}
.meta{text-align:right;font-size:13.5px}
.meta h2{font-size:20px;letter-spacing:.06em;margin-bottom:4px}
.meta b{color:var(--ink)}
.stamp{display:inline-block;margin-top:8px;transform:rotate(-6deg);border:3px solid var(--green);color:var(--green);font-family:Poppins,system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.12em;padding:2px 14px;border-radius:8px;opacity:.85}
.stamp.due{border-color:var(--red);color:var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.box h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-family:Inter,system-ui,sans-serif}
.box p{margin:0}
table{width:100%;border-collapse:collapse}
.items th{background:var(--deep);color:#fff;text-align:left;padding:9px 10px;font-size:13px}
.items th:last-child,.items td:last-child{text-align:right;white-space:nowrap}
.items td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.items td small{color:var(--muted);display:block}
.items tr.total td{border-bottom:0;font-weight:800;font-size:17px;color:var(--deep);background:var(--tint)}
.payline{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--greenlt);color:var(--green);font-weight:600}
.payline.due{background:var(--redlt);color:var(--red)}
.sec{margin-top:26px}
.sec h2{font-size:18px;margin-bottom:4px}
.sec .lead{color:var(--muted);margin:0 0 10px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sum>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sum b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.sum ul{margin:0;padding-left:18px}
.sum .good{color:var(--green);font-weight:600}
.sum .bad{color:var(--red)}
.qc th{text-align:left;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
.qc td{padding:7px 8px;border-bottom:1px solid #eef3f3;vertical-align:top}
.qc td.c{text-align:center;width:84px}
.qc th.c{text-align:center}
.qc td.r{color:#8A3B00;font-size:13px}
.t{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px}
.t.ok{background:var(--greenlt);color:var(--green)}
.t.fault{background:var(--redlt);color:var(--red)}
.t.na{background:#eee;color:#666}
.note{margin:10px 0 0;padding:8px 12px;background:#FFF8EC;border-left:3px solid #E8A317;border-radius:6px}
.foot{margin-top:26px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px;text-align:center}
.msg{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
@media (max-width:600px){.doc{padding:18px;border-radius:0;border-left:0;border-right:0}.cols,.sum{grid-template-columns:1fr}.meta{text-align:left}.qc td.c{width:64px}}
@media print{body{background:#fff}.bar{display:none}.doc{border:0;margin:0;max-width:none;padding:0}.sec.qcsec{break-before:auto}tr{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="msg">Loading…</div></div>
<script type="module">
import { backend, esc, rupees, when, trackUrl, invoiceUrl, invoiceNo, business, CHECKLISTS, qcCompare, payInfo, isWarranty, reviewUrl, warrantyInfo } from "/zh-ops.js?v=12";

const app = document.getElementById("app");
const id = new URLSearchParams(location.search).get("b");
const LBL = { ok: "OK", fault: "Not OK", na: "N/A", "": "—" };
const tag = (s) => (s ? `<span class="t ${s}">${LBL[s]}</span>` : "—");
const mask = (m) => (m ? "••••••" + String(m).slice(-4) : "");

function qcSection(b) {
  const pre = b.preQc, post = b.postQc;
  if (!pre && !post) return "";
  const items = (pre || post).items || [];
  const postMap = Object.fromEntries((post?.items || []).map((i) => [i.k, i]));
  const preFaults = (pre?.items || []).filter((i) => i.s === "fault");
  const postFaults = (post?.items || []).filter((i) => i.s === "fault");
  const cmp = qcCompare(pre, post);
  const fixed = preFaults.filter((i) => postMap[i.k]?.s === "ok");
  const rows = items.map((i) => {
    const a = (pre?.items || []).find((x) => x.k === i.k), z = postMap[i.k];
    const rem = [a?.r && `Before: ${esc(a.r)}`, z?.r && `After: ${esc(z.r)}`].filter(Boolean).join("<br>");
    return `<tr><td>${esc(i.l)}</td><td class="c">${pre ? tag(a?.s) : "—"}</td><td class="c">${post?.doneAt ? tag(z?.s) : "—"}</td><td class="r">${rem}</td></tr>`;
  }).join("");
  return `<div class="sec qcsec" id="qc">
    <h2>Quality check report</h2>
    <p class="lead">${esc(CHECKLISTS[(pre || post).type]?.name || "Device")} checked by ${esc(pre?.by || post?.by || b.techName || "ZippHive technician")}${pre?.doneAt ? ` · before repair ${when(pre.doneAt)}` : ""}${post?.doneAt ? ` · after repair ${when(post.doneAt)}` : ""}</p>
    <div class="sum">
      <div><b>Issues found before repair</b>${preFaults.length ? `<ul class="bad">${preFaults.map((i) => `<li>${esc(i.l)}${i.r ? ` — ${esc(i.r)}` : ""}</li>`).join("")}</ul>` : `<span class="good">No issues found</span>`}</div>
      <div><b>After repair</b>${!post?.doneAt ? `<span>Check not done yet</span>` : postFaults.length ? `<ul class="bad">${postFaults.map((i) => `<li>${esc(i.l)}${i.r ? ` — ${esc(i.r)}` : ""}</li>`).join("")}</ul>` : `<span class="good">✓ All functions working</span>`}${fixed.length ? `<div class="good" style="margin-top:6px">Fixed: ${fixed.map((i) => esc(i.l)).join(", ")}</div>` : ""}</div>
    </div>
    <table class="qc"><thead><tr><th>Function checked</th><th class="c">Before</th><th class="c">After</th><th>Remarks</th></tr></thead><tbody>${rows}</tbody></table>
    ${pre?.remark ? `<p class="note"><b>Condition before repair:</b> ${esc(pre.remark)}</p>` : ""}
    ${post?.remark ? `<p class="note"><b>After repair:</b> ${esc(post.remark)}</p>` : ""}
  </div>`;
}

function invoiceSection(b, biz) {
  if (!b.payment) return `<div class="payline due">Invoice will appear here automatically once the technician records the payment.</div>`;
  const pi = payInfo(b), W = isWarranty(b), WC = W && warrantyInfo(b).state !== "rejected";
  const desc = `${b.device ? esc(b.device) + " – " : ""}${esc(b.item || b.service)}<small>${W ? `Warranty claim ${esc(b.warranty?.claimId || "")}${b.warranty?.invoiceNo || b.warranty?.origCode ? ` · original ${esc(b.warranty.invoiceNo || b.warranty.origCode)}` : ""}` : esc(b.service || "Repair service")}</small>`;
  const quote = b.price != null && !W ? Number(b.price) : null;
  const lines = [];
  if (pi.state === "unpaid") {
    lines.push([desc, pi.charge]);
    if (pi.discount) lines.push([`Discount<small>${esc(pi.reason)}</small>`, -pi.discount]);
  } else {
    // charge (split out extra charges vs the quote), then any discount / warranty cover
    if (quote != null && pi.charge !== quote && !(pi.discount && pi.charge === quote)) {
      lines.push([desc, quote]);
      lines.push([(pi.charge > quote ? "Additional charges" : "Price adjustment") + (pi.reason && !pi.discount ? `<small>${esc(pi.reason)}</small>` : ""), pi.charge - quote]);
    } else lines.push([desc, pi.charge]);
    if (pi.discount) lines.push([(pi.discountType === "warranty" || (WC && pi.state === "free") ? "Covered under warranty" : pi.discountType === "full" ? "Discount (100%)" : "Discount") + (pi.reason ? `<small>${esc(pi.reason)}</small>` : ""), -pi.discount]);
  }
  const total = pi.state === "unpaid" ? Math.max(0, pi.charge - pi.discount) : pi.amount;
  return `
    <table class="items"><thead><tr><th>Description</th><th>Amount</th></tr></thead><tbody>
      ${lines.map(([d, v]) => `<tr><td>${d}</td><td>${v < 0 ? "− " + rupees(-v) : rupees(v)}</td></tr>`).join("")}
      <tr class="total"><td>${pi.state === "unpaid" ? "Amount due" : pi.state === "free" ? "Total payable" : "Total paid"}</td><td>${rupees(total)}</td></tr>
    </tbody></table>
    ${pi.state === "paid"
      ? `<div class="payline">✓ Paid ${rupees(pi.amount)} by ${esc(pi.mode)}${pi.ref ? ` · Ref ${esc(pi.ref)}` : ""} · ${when(pi.at)}${pi.by ? ` · collected by ${esc(pi.by)}` : ""}</div>`
      : pi.state === "free"
      ? `<div class="payline">✓ No payment needed — ${WC || pi.discountType === "warranty" ? "covered under ZippHive warranty" : "100% discount"} · ${when(pi.at)}${pi.by ? ` · ${esc(pi.by)}` : ""}</div>`
      : `<div class="payline due">Payment pending${pi.note ? ` — ${esc(pi.note)}` : ""}. Please contact ZippHive on ${esc(biz.phone)}.</div>`}`;
}

function render(b) {
  if (!id) { app.innerHTML = `<div class="msg"><h2>Invoice not found</h2><p>Please open the link ZippHive sent you.</p></div>`; return; }
  if (b === null) { app.innerHTML = `<div class="msg"><h2>Invoice not found</h2><p>This link may be wrong. Please contact ZippHive.</p></div>`; return; }
  const biz = business();
  const p = b.payment, pst = payInfo(b).state, paid = pst === "paid" || pst === "free";
  const title = p ? "Invoice" : "Service report";
  document.title = `${p ? "ZippHive Invoice " + invoiceNo(b) : "ZippHive Service Report " + b.code}`;
  const share = `Hi, here is the ZippHive ${p ? "invoice" : "service report"} for booking ${b.code}: ${invoiceUrl(b.id)}`;
  app.innerHTML = `
  <div class="bar">
    <button class="btn" onclick="window.print()">⬇️ Download / Print PDF</button>
    <a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(share)}">Share on WhatsApp</a>
    <a class="btn o" href="${trackUrl(b.id)}">← Back to tracking</a>
    ${b.status === "completed" && !isWarranty(b) ? `<a class="btn o" href="/warranty.html?b=${encodeURIComponent(b.id)}">🛡️ Raise warranty claim</a>` : ""}
  </div>
  <div class="doc">
    <div class="head">
      <div class="brand"><img src="/zh-icon.png" alt=""><div><h1>Zipp<span>Hive</span></h1><small>${esc(biz.tagline)}</small><small>${esc(biz.address)} · ${esc(biz.phone)}</small><small>${esc(biz.email)} · ${esc(biz.web)}</small>${biz.gstin ? `<small>GSTIN: ${esc(biz.gstin)}</small>` : ""}</div></div>
      <div class="meta"><h2>${title.toUpperCase()}</h2>
        ${p ? `<div>Invoice no: <b>${esc(invoiceNo(b))}</b></div><div>Date: <b>${when(p.at)}</b></div>` : ""}
        <div>Booking: <b>${esc(b.code)}</b></div>
        ${p ? `<div class="stamp ${paid ? "" : "due"}">${pst === "free" ? (isWarranty(b) && warrantyInfo(b).state !== "rejected" ? "WARRANTY · ₹0" : "NO CHARGE") : paid ? "PAID" : "DUE"}</div>` : ""}</div>
    </div>
    <div class="cols">
      <div class="box"><h3>Billed to</h3><p><b>${esc(b.name)}</b></p><p>${esc(mask(b.mobile))}</p><p>${esc(b.area)}, Patna</p></div>
      <div class="box"><h3>Service</h3><p><b>${b.device ? esc(b.device) + " – " : ""}${esc(b.item || b.service)}</b></p>${b.problem ? `<p>${esc(b.problem)}</p>` : ""}<p>Technician: ${esc(b.techName || "—")}</p>${b.times?.completed ? `<p>Completed: ${when(b.times.completed)}</p>` : ""}</div>
      ${(() => { const wi = warrantyInfo(b); return wi ? `<div class="box"><h3>Warranty claim ${esc(b.warranty?.claimId || "")}</h3><p><b style="color:${wi.state === "approved" ? "#1E8E3E" : wi.state === "rejected" ? "#C62828" : "#8A5A00"}">${wi.state === "approved" ? "✅ Approved – covered" : wi.state === "rejected" ? "❌ Not covered" : "⏳ Under review"}</b></p>${wi.defect ? `<p>Defect: ${esc(wi.defect)}</p>` : ""}${wi.reason ? `<p>Reason: ${esc(wi.reason)}</p>` : ""}${wi.at ? `<p>${when(wi.at)}</p>` : ""}</div>` : ""; })()}
    </div>
    ${invoiceSection(b, biz)}
    ${qcSection(b)}
    <div class="foot">${reviewUrl() ? `<a href="${esc(reviewUrl())}" target="_blank" rel="noopener" style="display:inline-block;margin-bottom:10px;font-weight:800;color:#0B7F7D">⭐ Loved our service? Rate us on Google</a><br>` : ""}Thank you for choosing ZippHive! Questions? WhatsApp ${esc(biz.phone)}.<br>Problem after the repair? Raise a warranty claim at ${esc(biz.web)}/warranty.html<br>This is a computer-generated document and does not need a signature.</div>
  </div>`;
}

const be = await backend();
if (!be || !id) render(id ? null : undefined);
else be.watchBooking(id, (b) => render(b), () => render(null));
</script>
</body>
</html>
