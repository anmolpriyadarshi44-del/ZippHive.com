<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#053E40" />
<title>ZippHive Website Analytics</title>
<link rel="icon" href="/zh-icon.png" />
<script src="/zipphive-config.js?v=15"></script>
<link rel="stylesheet" href="/zh-ops.css?v=15" />
<style>
.wrap{max-width:1100px}
.embed header.top{display:none}
.embed .wrap{padding-top:8px}
.dbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 14px}
.seg{display:inline-flex;background:var(--tint);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:8px;font-weight:700;font-size:13px;color:var(--dark);cursor:pointer}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dbar input[type=date]{min-height:36px;width:auto;padding:4px 8px}
.dbar .rng{font-weight:800;color:var(--deep);font-size:13.5px;margin-left:auto}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:4px solid var(--teal)}
.kpi b{display:block;font-size:26px;color:var(--deep);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.hero{border-top-color:#1E8E3E}
.card h2{margin:0 0 4px;font-size:16px;color:var(--deep)}
.card p.muted{margin:0 0 12px;font-size:13px}
.fn{display:grid;grid-template-columns:200px minmax(0,1fr) 150px;gap:6px 12px;align-items:center}
.fn .lb{font-weight:700;font-size:14px;color:var(--ink)}
.fn .lb small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fn .tr{height:28px;background:#EEF4F3;border-radius:6px;position:relative}
.fn .br{height:100%;background:var(--teal);border-radius:0 4px 4px 0}
.fn .br.last{background:#1E8E3E}
.fn .nm{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--ink)}
.fn .nm b{font-size:16px}
.fn .drop{display:block;font-size:12px;color:var(--muted)}
.fn .drop.bad{color:var(--red);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid #EEF4F3;font-variant-numeric:tabular-nums}
table.t td.n,table.t th.n{text-align:right}
.mini{display:inline-block;height:8px;background:var(--teal);border-radius:0 3px 3px 0;vertical-align:middle;margin-right:8px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px;align-items:center;margin-bottom:7px}
.rl .bw{grid-column:1/3;height:6px;border-radius:3px;background:#EEF4F3;overflow:hidden}
.rl .bw i{display:block;height:100%;background:var(--teal);border-radius:0 3px 3px 0}
.rl b{font-variant-numeric:tabular-nums}
.note{background:#F6FAF9;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.fn{grid-template-columns:120px minmax(0,1fr) 96px}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"><div class="center muted" style="padding:40px">Loading…</div></div>
<script type="module">
import { backend, esc, toast } from "/zh-ops.js?v=19";

const EMBED = new URLSearchParams(location.search).has("embed");
if (EMBED) document.documentElement.classList.add("embed");
try { localStorage.setItem("zh-staff", "1"); } catch {}
const LS = (k, d) => { try { const v = localStorage.getItem("zha:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const S = { be: null, user: undefined, ok: false, range: LS("range", { preset: "7d", from: "", to: "" }), data: null, loading: false };
const app = document.getElementById("app");
const DAY = 86400000;
const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const PRESETS = [["today", "Today"], ["yesterday", "Yesterday"], ["7d", "Last 7 days"], ["30d", "Last 30 days"], ["month", "This month"], ["custom", "Custom"]];
function rangeOf() {
  const t0 = sod(Date.now()), r = S.range;
  if (r.preset === "today") return [ymd(t0), ymd(t0)];
  if (r.preset === "yesterday") return [ymd(t0 - DAY), ymd(t0 - DAY)];
  if (r.preset === "30d") return [ymd(t0 - 29 * DAY), ymd(t0)];
  if (r.preset === "month") { const d = new Date(t0); return [ymd(new Date(d.getFullYear(), d.getMonth(), 1)), ymd(t0)]; }
  if (r.preset === "custom" && r.from && r.to) return r.from <= r.to ? [r.from, r.to] : [r.to, r.from];
  return [ymd(t0 - 6 * DAY), ymd(t0)];
}
const fmtD = (s) => new Date(s + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const SVC = { cleaning: "Home Cleaning", mobile: "Mobile Repair", ac: "AC Repair & Installation", amc: "AC AMC Plans", home: "Washing Machine, Plumber & Electrician" };
const SRC = { direct: "Direct / typed URL", google: "Google search", social: "Instagram / Facebook", whatsapp: "WhatsApp link", other: "Other websites" };

async function load() {
  const [f, t] = rangeOf();
  S.loading = true; render();
  try { S.data = await S.be.getStats(f, t); }
  catch (x) { S.data = {}; toast("Couldn't load analytics: " + (x.message || x), true); }
  S.loading = false; render();
}
function totals() {
  const T = {};
  for (const n of Object.values(S.data || {})) for (const [k, v] of Object.entries(n)) T[k] = (T[k] || 0) + (Number(v) || 0);
  return T;
}
function funnel(rows) {
  const top = Math.max(1, rows[0][2]);
  return `<div class="fn">${rows.map(([label, sub, v], i) => {
    const prev = i ? rows[i - 1][2] : null, drop = prev ? 100 - pct(v, prev) : null;
    return `<div class="lb">${label}<small>${sub}</small></div>
      <div class="tr" title="${esc(label)}: ${v} (${pct(v, top)}% of visitors)"><div class="br ${i === rows.length - 1 ? "last" : ""}" style="width:${(v / top) * 100}%;min-width:${v ? 2 : 0}px"></div></div>
      <div class="nm"><b>${v}</b> · ${pct(v, top)}%${drop != null && prev ? `<span class="drop ${drop >= 50 ? "bad" : ""}">↓ ${drop}% left at this step</span>` : ""}</div>`;
  }).join("")}</div>`;
}
function list(entries, fmt = (v) => v) {
  const e = entries.filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!e.length) return `<p class="muted">Nothing yet in this period.</p>`;
  const max = e[0][1];
  return e.slice(0, 15).map(([k, v]) => `<div class="rl"><span>${esc(k)}</span><b>${fmt(v)}</b><span class="bw"><i style="width:${(v / max) * 100}%"></i></span></div>`).join("");
}
function view() {
  const T = totals(), [f, t] = rangeOf(), days = Object.keys(S.data || {}).sort();
  const visits = T.visit || 0;
  if (S.loading) return `<div class="card empty">Loading…</div>`;
  if (!visits && !T.booked) return `<div class="card empty">No visits recorded for ${fmtD(f)}${f !== t ? " – " + fmtD(t) : ""} yet.<br><small>Counting starts from the day this page went live. Visits by you and your store managers are not counted.</small></div>`;
  const svcRows = Object.entries(SVC).map(([id, name]) => [name, T["svc_" + id] || 0, T["step_slot_" + id] || 0, T["booked_" + id] || 0]).filter((r) => r[1] || r[3]);
  const allDays = []; for (let d = new Date(f + "T00:00").getTime(); d <= new Date(t + "T00:00").getTime(); d += DAY) allDays.push(ymd(d));
  const maxV = Math.max(1, ...allDays.map((d) => S.data[d]?.visit || 0));
  return `
  <div class="kpis">
    <div class="kpi"><b>${visits}</b><span>Visitors</span><small>unique per day</small></div>
    <div class="kpi"><b>${T.step_svc || 0}</b><span>Started a booking</span><small>${pct(T.step_svc || 0, visits)}% of visitors</small></div>
    <div class="kpi"><b>${T.step_slot || 0}</b><span>Picked a time slot</span><small>${pct(T.step_slot || 0, visits)}% of visitors</small></div>
    <div class="kpi hero"><b>${T.booked || 0}</b><span>Bookings</span><small>from the website flow</small></div>
    <div class="kpi hero"><b>${pct(T.booked || 0, visits)}%</b><span>Conversion</span><small>bookings ÷ visitors</small></div>
    <div class="kpi"><b>${(T.click_whatsapp || 0) + (T.click_call || 0)}</b><span>WhatsApp + call taps</span><small>${T.click_whatsapp || 0} WhatsApp · ${T.click_call || 0} call</small></div>
  </div>
  <div class="card"><h2>Booking funnel – where visitors stop</h2><p class="muted">Each bar = how many visitors reached that step. Red text = a step where half or more left.</p>
    ${funnel([["Visited the website", "home or cleaning page", visits], ["Chose a service", "opened the booking flow", T.step_svc || 0], ["Saw the price", "picked repair / item / plan", T.step_price || 0], ["Picked a time slot", "slot screen", T.step_slot || 0], ["Entered details", "name, mobile, pincode", T.step_details || 0], ["Booking confirmed", "booking received", T.booked || 0]])}
  </div>
  <div class="grid2">
    <div class="card"><h2>By service</h2><p class="muted">Which services people open – and which turn into bookings.</p>
      ${svcRows.length ? `<table class="t"><thead><tr><th>Service</th><th class="n">Opened</th><th class="n">Reached slot</th><th class="n">Booked</th><th class="n">Conv.</th></tr></thead><tbody>${svcRows.map(([n, o, s, b]) => `<tr><td>${esc(n)}</td><td class="n">${o}</td><td class="n">${s}</td><td class="n"><b>${b}</b></td><td class="n">${pct(b, o)}%</td></tr>`).join("")}</tbody></table>` : `<p class="muted">Nothing yet in this period.</p>`}</div>
    <div class="card"><h2>Mobile repair steps</h2><p class="muted">Phone flow: brand → model → problem → price → slot → booked.</p>
      ${funnel([["Chose brand", "", T.svc_mobile || 0], ["Chose model", "", T.step_model || 0], ["Chose problem", "", T.step_issue || 0], ["Reached slot", "", T.step_slot_mobile || 0], ["Booked", "", T.booked_mobile || 0]])}</div>
  </div>
  <div class="grid2" style="margin-top:12px">
    <div class="card"><h2>Where visitors come from</h2>${list(Object.entries(T).filter(([k]) => k.startsWith("src_")).map(([k, v]) => [SRC[k.slice(4)] || k.slice(4), v]))}</div>
    <div class="card"><h2>Other actions</h2>${list([["Opened the AI assistant", T.ai_open || 0], ["Tapped WhatsApp", T.click_whatsapp || 0], ["Tapped call", T.click_call || 0], ["Checked a pincode", T.pin_check || 0], ["…pincode served ✅", T.pin_check_ok || 0], ["Visited the cleaning page", T.visit_cleaning || 0]])}</div>
  </div>
  <div class="grid2" style="margin-top:12px">
    <div class="card"><h2>Pincodes we don't serve yet</h2><p class="muted">People from these pincodes tried to book or checked – useful for choosing where to expand.</p>${list(Object.entries(T).filter(([k]) => k.startsWith("pinout_")).map(([k, v]) => [k.slice(7), v]), (v) => v + " visitor" + (v > 1 ? "s" : ""))}</div>
    <div class="card"><h2>Day by day</h2>
      <table class="t"><thead><tr><th>Date</th><th>Visitors</th><th class="n">Bookings</th></tr></thead><tbody>
      ${allDays.slice().reverse().slice(0, 31).map((d) => { const n = S.data[d] || {}; return `<tr><td>${fmtD(d)}</td><td><span class="mini" style="width:${((n.visit || 0) / maxV) * 140}px;min-width:${n.visit ? 2 : 0}px" title="${n.visit || 0} visitors"></span>${n.visit || 0}</td><td class="n"><b>${n.booked || 0}</b></td></tr>`; }).join("")}
      </tbody></table></div>
  </div>
  <div class="note">How it counts: each visitor is counted once per step per day (anonymously – no names or numbers are stored). Visits by you and your store managers are not counted. Bookings made over WhatsApp or phone aren't in this funnel – see them on the Store Manager dashboard.</div>`;
}
function render() {
  const head = `<header class="top"><span class="brand">Zipp<span>Hive</span></span><span class="role">Website analytics</span><span class="sp"></span>
    ${S.user ? `<a class="btn sm ghost" href="/manager.html">← Dashboard</a><button class="btn sm ghost" data-act="signout">Sign out</button>` : ""}</header>`;
  if (!S.be) { app.innerHTML = head + `<div class="card login"><h2>Not configured</h2></div>`; return; }
  if (S.user === undefined) { app.innerHTML = head + `<div class="center muted" style="padding:40px">Loading…</div>`; return; }
  if (!S.user) { app.innerHTML = head + `<div class="card login"><h2>Sign in</h2><p class="muted">Admin or store manager account.</p><button class="btn" data-act="signin">Sign in with Google</button><p class="muted" style="margin-top:10px;font-size:13px">Not a Gmail account? <a href="/manager.html">Sign in on the store manager page</a> first.</p></div>`; return; }
  if (!S.ok) { app.innerHTML = head + `<div class="card login"><h2>Not authorised</h2><p class="muted">${esc(S.user.email)} is not a ZippHive admin or store manager.</p></div>`; return; }
  const [f, t] = rangeOf();
  app.innerHTML = head + `<div class="wrap">
    <h1 style="margin:6px 0 2px">Website analytics</h1><p class="muted" style="margin:0">How many people visit and how far they get in booking.</p>
    <div class="dbar"><div class="seg">${PRESETS.map(([k, l]) => `<button class="${S.range.preset === k ? "on" : ""}" data-act="preset" data-p="${k}">${l}</button>`).join("")}</div>
      ${S.range.preset === "custom" ? `<input type="date" class="in" id="dFrom" value="${esc(S.range.from || f)}" max="${ymd(Date.now())}" aria-label="From"><span class="muted">to</span><input type="date" class="in" id="dTo" value="${esc(S.range.to || t)}" max="${ymd(Date.now())}" aria-label="To">` : ""}
      <span class="rng">📅 ${fmtD(f)}${f !== t ? " – " + fmtD(t) : ""}</span><button class="btn sm g" data-act="reload">↻ Refresh</button></div>
    ${S.data == null ? `<div class="card empty">Loading…</div>` : view()}
  </div>`;
}
app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "signin") return S.be.signIn();
  if (a === "signout") return S.be.signOut();
  if (a === "reload") return load();
  if (a === "preset") {
    const p = el.dataset.p;
    if (p === "custom") { const [f, t] = rangeOf(); S.range = { preset: "custom", from: f, to: t }; }
    else S.range = { ...S.range, preset: p };
    try { localStorage.setItem("zha:range", JSON.stringify(S.range)); } catch {}
    return load();
  }
});
app.addEventListener("change", (e) => {
  if (e.target.id === "dFrom" || e.target.id === "dTo") {
    S.range[e.target.id === "dFrom" ? "from" : "to"] = e.target.value;
    try { localStorage.setItem("zha:range", JSON.stringify(S.range)); } catch {}
    load();
  }
});
S.be = await backend();
render();
if (S.be) S.be.onUser(async (u) => {
  S.user = u; S.ok = false;
  if (u) { S.ok = await S.be.isManager(u.email); if (S.ok) return load(); }
  render();
});
</script>
</body>
</html>
