<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#053E40" />
<title>ZippHive Store Manager</title>
<link rel="icon" href="/zh-icon.png" />
<script src="/zipphive-config.js?v=13"></script>
<link rel="stylesheet" href="/zh-ops.css?v=13" />
<style>
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;border-left:5px solid var(--line)}
.kpi b{display:block;font-family:Poppins,system-ui,sans-serif;font-size:26px;color:var(--deep);line-height:1.1}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.kpi.k-new{border-left-color:var(--y)}.kpi.k-need{border-left-color:var(--red)}.kpi.k-wait{border-left-color:#E8A317}.kpi.k-act{border-left-color:var(--teal)}.kpi.k-done{border-left-color:var(--green)}
.kpi.k-cash{border-left-color:#7B5CD6}.kpi small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.pill.wty{background:#053E40;color:#FFC72C}
.flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.flag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#FFF1E0;color:#8A4B00}
.flag.red{background:var(--redlt);color:var(--red)}
.flag.green{background:var(--greenlt);color:var(--green)}
.phase{font-weight:700;color:var(--deep);font-size:13.5px;display:flex;align-items:center;gap:6px}
.phase.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#16B87A;animation:pulse 1.8s infinite;box-shadow:0 0 0 0 rgba(22,184,122,.6)}
.phase.warn{color:var(--red)}
details.js{margin-top:10px}
details.js summary{cursor:pointer;font-weight:700;color:var(--teal);font-size:13.5px}
.kpi.sel{outline:2px solid var(--teal);outline-offset:-1px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-weight:600;font-size:13.5px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip em{font-style:normal;opacity:.75;margin-left:4px}
.bar .in{max-width:260px;margin-left:auto}
.bk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.bk h3{margin:6px 0 2px}
.bk .meta{margin-top:4px}
.asg{border-radius:12px;padding:10px 12px;background:var(--tint);display:flex;flex-direction:column;gap:8px;align-self:start}
.asg.need{background:var(--redlt)}
.asg.wait{background:var(--ylt)}
.asg.ok{background:var(--greenlt)}
.asg.new{background:#FFF9E8}
.asg .t{font-weight:700;font-size:13.5px;color:var(--deep)}
.asg .t.red{color:var(--red)}
.asg .note{font-size:13px;color:var(--muted)}
.asg .note.warn{color:#8A5A00;font-weight:600}
.pickrow{display:flex;gap:6px}
.pickrow select{flex:1;min-width:0}
.foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.side h2{display:flex;justify-content:space-between;align-items:center}
.tech{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tech:first-of-type{border-top:0}
.tech .av{width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:18px;flex:none;overflow:hidden}
.tech .av img{width:100%;height:100%;object-fit:cover}
.tech .nm{font-weight:700;font-size:14px}
.tech .st{font-size:12.5px;font-weight:600}
.st.free{color:var(--green)}.st.busy{color:var(--teal)}.st.pend{color:#8A5A00}.st.off{color:var(--muted)}
.wr{margin-top:10px;border-radius:12px;padding:12px;background:#FFF6D9;border:1px solid #F1D98A;display:flex;flex-direction:column;gap:8px}
.wr.ok{background:var(--greenlt);border-color:#BFE3C8}.wr.bad{background:var(--redlt);border-color:#F2C2C2}
.wr .t{font-weight:800;color:var(--deep);font-size:14.5px}
.wr .note{font-size:13px;color:var(--muted)}
.wr .found{font-size:13px;background:#fff;border-radius:8px;padding:8px 10px}
.wr .found b{color:var(--red)}
.wr label{font-size:12.5px;font-weight:700;color:var(--deep)}
.wr textarea{min-height:56px}
.wr .reasons{display:flex;flex-wrap:wrap;gap:6px}
.wr .reasons button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.wr .reasons button.on{background:var(--red);border-color:var(--red);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:700px){.bk{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.bar .in{max-width:none;margin-left:0}}
</style>
</head>
<body>
<div id="app"><div class="center muted">Loading…</div></div>
<script type="module">
import { backend, STATUS, CLOSED, actions, stage, trackUrl, waLink, ago, when, esc, toast, admins, invoiceUrl, jobPhase, jobSheetHtml, qcSum, qcCompare, rupees, payInfo, isWarranty, pingSheet, warrantyInfo, W_REASONS } from "/zh-ops.js?v=13";

const FLOW = ["new", "confirmed", "assigned", "on_the_way", "arrived", "in_progress", "completed"];
const S = { sheets: new Set(), be: undefined, user: undefined, ok: false, bookings: null, techs: [], managers: [], filter: "action", q: "", draft: { eta: {}, pick: {}, wr: {} } };
const app = document.getElementById("app");
let unsub = null;

const isToday = (t) => t && new Date(t).toDateString() === new Date().toDateString();
const isAdmin = () => S.user && admins().includes(S.user.email);

function counts() {
  const c = { new: 0, need: 0, wait: 0, act: 0, done: 0, cash: 0, modes: {}, unpaid: 0, free: 0 };
  for (const b of S.bookings || []) {
    const s = stage(b);
    if (s === "new") c.new++;
    else if (s === "unassigned" || s === "declined") c.need++;
    else if (s === "waiting") c.wait++;
    else if (s === "active") c.act++;
    else if (s === "done" && isToday(b.statusAt)) c.done++;
    const p = b.payment;
    if (p && p.status === "free" && isToday(p.at)) c.free++;
    if (p && p.status === "paid" && isToday(p.at)) { c.cash += Number(p.amount) || 0; c.modes[p.mode] = (c.modes[p.mode] || 0) + (Number(p.amount) || 0); }
    if (p && p.status === "not_collected" && b.status !== "cancelled") c.unpaid++;
  }
  return c;
}

function techLoad(email) {
  const mine = (S.bookings || []).filter((b) => b.techEmail === email && !CLOSED.includes(b.status));
  return { pending: mine.filter((b) => b.assignState === "pending"), active: mine.filter((b) => b.assignState !== "pending") };
}

// warranty job whose defect has been checked by the technician but the store hasn't decided yet
const wReady = (b) => warrantyInfo(b)?.state === "pending" && !!b.preQc?.doneAt && b.status !== "cancelled";
const needsAction = (b) => ["new", "unassigned", "declined"].includes(stage(b)) || wReady(b);

function visible() {
  const order = { new: 0, declined: 1, unassigned: 2, waiting: 3, active: 4, done: 5, cancelled: 6 };
  const q = S.q.trim().toLowerCase();
  return (S.bookings || [])
    .filter((b) => {
      const s = stage(b);
      switch (S.filter) {
        case "action": return needsAction(b);
        case "waiting": return s === "waiting";
        case "active": return s === "active";
        case "done": return s === "done";
        case "cancelled": return s === "cancelled";
        case "warranty": return isWarranty(b) && s !== "cancelled";
        default: return true;
      }
    })
    .filter((b) => !q || `${b.code} ${b.name} ${b.mobile} ${b.area} ${b.device || ""} ${b.item || ""} ${b.service || ""} ${b.techName || b.offerName || ""}`.toLowerCase().includes(q))
    .sort((a, b) => order[stage(a)] - order[stage(b)] || b.createdAt - a.createdAt);
}

function techOptions(b) {
  const list = S.techs.filter((t) => t.active !== false).map((t) => ({ t, load: techLoad(t.email) }));
  list.sort((x, y) => x.load.active.length - y.load.active.length || x.t.name.localeCompare(y.t.name));
  const cur = S.draft.pick[b.id] ?? "";
  return `<option value="">— Choose technician —</option>` + list
    .filter(({ t }) => !(b.assignState === "pending" && t.email === b.techEmail))
    .map(({ t, load }) => {
      const st = load.active.length ? `${load.active.length} on job` : "Free";
      return `<option value="${esc(t.email)}" ${cur === t.email ? "selected" : ""}>${esc(t.name)} · ${st}${t.skills ? " · " + esc(t.skills) : ""}</option>`;
    }).join("");
}

function assignBox(b) {
  const s = stage(b);
  const pick = (label) => `
    <div class="pickrow">
      <select class="in" id="pick-${b.id}" data-pick="${b.id}" aria-label="Technician for ${esc(b.code)}">${techOptions(b)}</select>
      <button class="btn sm" data-act="send" data-id="${b.id}">${label}</button>
    </div>`;
  if (s === "new") return `<div class="asg new"><div class="t">New booking — confirm it and send to a technician</div>
    <button class="btn sm wa" data-act="confirm-wa" data-id="${b.id}">✅ Confirm &amp; send WhatsApp</button>${pick("Send job")}</div>`;
  if (s === "unassigned") return `<div class="asg need"><div class="t red">No technician yet</div>${pick("Send job")}</div>`;
  if (s === "declined") return `<div class="asg need"><div class="t red">✋ ${esc(b.declinedByName || "Technician")} declined${b.declineReason ? ` — “${esc(b.declineReason)}”` : ""}</div><div class="note">${ago(b.declinedAt)} · choose someone else</div>${pick("Send job")}</div>`;
  if (s === "waiting") {
    const t = S.techs.find((x) => x.email === b.techEmail);
    const mins = (Date.now() - (b.offeredAt || 0)) / 60000;
    const ping = t && t.phone ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(t.phone, `Hi ${t.name}, new ZippHive job ${b.code} (${b.item || b.service}, ${b.area}) is waiting for you. Please accept in the technician app: ${location.origin}/tech.html`)}">Ping on WhatsApp</a>` : "";
    return `<div class="asg wait"><div class="t">⏳ Waiting for ${esc(b.offerName || b.techEmail)} to accept</div>
      <div class="note ${mins > 10 ? "warn" : ""}">Sent ${ago(b.offeredAt)}${mins > 10 ? " — no response yet, give them a call" : ""}</div>
      <div class="row">${ping}<button class="btn sm r" data-act="unassign" data-id="${b.id}">Withdraw</button></div>
      <details><summary class="muted" style="cursor:pointer">Send to someone else</summary><div style="margin-top:6px">${pick("Send")}</div></details></div>`;
  }
  if (s === "active") {
    const i = FLOW.indexOf(b.status);
    const legacy = b.assignState !== "accepted";
    return `<div class="asg ok"><div class="t">✅ ${esc(b.techName || b.offerName || b.techEmail)} ${legacy ? "assigned" : "accepted"}</div>
      <div class="phase ${jobPhase(b).tone}">${esc(jobPhase(b).label)}</div>
      <div class="note">${b.acceptedAt ? "Accepted " + ago(b.acceptedAt) : ""}${b.times?.[b.status] ? " · this step " + ago(b.times[b.status]) : ""}${b.techLoc && Date.now() - b.techLoc.at < 120000 ? " · 📍 live location on" : ""}</div>
      <div class="steps" aria-hidden="true">${FLOW.slice(2).map((f, k) => `<i class="${k + 2 < i ? "on" : k + 2 === i ? "now" : ""}"></i>`).join("")}</div>
      ${["assigned"].includes(b.status) ? `<button class="btn link" data-act="unassign" data-id="${b.id}">Take job back</button>` : ""}</div>`;
  }
  if (s === "done") {
    const pi = payInfo(b);
    return `<div class="asg ${pi.state === "unpaid" ? "need" : "ok"}"><div class="t">Completed ${when(b.statusAt)}</div><div class="note">by ${esc(b.techName || "—")}</div>
      <div class="note"><b>${pi.state === "paid" ? `💰 ${rupees(pi.amount)} · ${esc(pi.mode)}` : pi.state === "free" ? `🛡️ ${esc(pi.label)}` : pi.state === "unpaid" ? "⚠ Payment not collected" : "No payment recorded"}</b></div></div>`;
  }
  return `<div class="asg"><div class="t">Cancelled</div><div class="note">${when(b.statusAt)}</div></div>`;
}

function card(b) {
  const s = stage(b);
  const open = !["done", "cancelled"].includes(s);
  const etaVal = S.draft.eta[b.id] ?? b.eta ?? "";
  return `<div class="card bk">
    <div>
      <div class="row"><b>${esc(b.code)}</b>${isWarranty(b) ? `<span class="pill wty">🛡️ Warranty ${esc(b.warranty?.claimId || "")}</span>` : ""}<span class="pill ${esc(b.status)}">${esc(STATUS[b.status] || b.status)}</span><span class="muted">${ago(b.createdAt)}</span></div>
      <h3>${b.device ? esc(b.device) + " – " : ""}${esc(b.item || b.service)}${b.price ? ` · ₹${Number(b.price).toLocaleString("en-IN")}` : ""}</h3>
      ${b.problem ? `<div class="muted">${esc(b.problem)}</div>` : ""}
      <div class="meta"><b>${esc(b.name)}</b> · <a href="tel:+91${esc(b.mobile)}">${esc(b.mobile)}</a> · ${esc(b.area)} · ${esc(b.time)}</div>
      ${b.note ? `<div class="muted">Note: ${esc(b.note)}</div>` : ""}
      ${flags(b)}
      ${wBox(b)}
      ${b.preQc || b.payment ? `<div class="row" style="margin-top:8px"><a class="btn sm o" href="${invoiceUrl(b.id)}" target="_blank" rel="noopener">🧾 ${b.payment ? "Invoice & QC report" : "QC report"}</a>${b.payment ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waLink(b.mobile, `Hi ${b.name}, your ZippHive invoice & quality check report for booking ${b.code}: ${invoiceUrl(b.id)}`)}">Send invoice</a>` : ""}</div>` : ""}
      ${b.preQc || b.postQc || b.payment || b.techRemarks || isWarranty(b) ? `<details class="js" data-sheet="${b.id}" ${S.sheets.has(b.id) ? "open" : ""}><summary>📋 Job sheet — checks, remarks, payment, timeline</summary>${jobSheetHtml(b)}</details>` : ""}
      ${open ? `<div class="foot">
        <input class="in" style="width:150px;min-height:34px" id="eta-${b.id}" data-eta="${b.id}" placeholder="ETA e.g. 4:30 PM" value="${esc(etaVal)}" aria-label="ETA for ${esc(b.code)}">
        <button class="btn sm g" data-act="eta" data-id="${b.id}">Save ETA</button>
        ${b.status !== "new" ? `<button class="btn sm wa" data-act="confirm-wa" data-id="${b.id}">${b.confirmSentAt ? "Resend tracking link" : "📲 Send confirmation"}</button>` : ""}
        <button class="btn sm o" data-act="copy" data-id="${b.id}">Copy link</button>
        <a class="btn sm g" href="${trackUrl(b.id)}" target="_blank" rel="noopener">Customer view</a>
        <button class="btn sm r" data-act="cancel" data-id="${b.id}">Cancel</button>
      </div>` : ""}
    </div>
    ${assignBox(b)}
  </div>`;
}

function flags(b) {
  const f = [];
  const pre = qcSum(b.preQc), post = qcSum(b.postQc), cmp = qcCompare(b.preQc, b.postQc);
  if (b.preQc && pre.fault) f.push(`<span class="flag">${pre.fault} not OK before repair</span>`);
  if (cmp.newIssues.length) f.push(`<span class="flag red">⚠ ${cmp.newIssues.length} new issue after repair</span>`);
  else if (b.postQc?.doneAt && !post.fault) f.push(`<span class="flag green">✓ All OK after repair</span>`);
  const pi = payInfo(b);
  if (pi.state === "unpaid") f.push(`<span class="flag red">Unpaid</span>`);
  else if (pi.state === "free") f.push(`<span class="flag green">🛡️ ${esc(pi.label)}</span>`);
  else if (pi.state === "paid" && pi.discount) f.push(`<span class="flag">Discount ${rupees(pi.discount)}${pi.reason ? " – " + esc(pi.reason) : ""}</span>`);
  else if (pi.state === "paid" && b.price && pi.amount !== Number(b.price)) f.push(`<span class="flag">Paid ${rupees(pi.amount)} vs quote ${rupees(b.price)}</span>`);
  const wi = warrantyInfo(b);
  if (wi && b.status !== "cancelled") {
    if (wi.state === "pending") f.unshift(`<span class="flag ${wReady(b) ? "red" : ""}">🛡️ ${wReady(b) ? "Warranty decision needed" : "Warranty check pending"}</span>`);
    else f.unshift(`<span class="flag ${wi.state === "approved" ? "green" : "red"}">${wi.state === "approved" ? "✅ Warranty approved" : "❌ Not covered"}</span>`);
    if (wi.state !== "pending" && !b.warrantyReview?.sentAt) f.push(`<span class="flag red">📲 Decision not sent</span>`);
  }
  if (isWarranty(b) && b.warranty?.photo && !b.preQc) f.push(`<a class="flag" href="${esc(b.warranty.photo)}" target="_blank" rel="noopener">📷 Customer photo</a>`);
  if (b.techRemarks) f.push(`<span class="flag">📝 Remarks</span>`);
  if (!b.confirmSentAt && !["new", "completed", "cancelled"].includes(b.status)) f.unshift(`<span class="flag red">📲 Confirmation not sent</span>`);
  return f.length ? `<div class="flags">${f.join("")}</div>` : "";
}

// ---- Warranty check: store manager looks at the defect and decides covered / not covered ----
const wDraft = (b) => (S.draft.wr[b.id] ||= {
  defect: (b.preQc?.items || []).filter((i) => i.s === "fault").map((i) => i.l + (i.r ? ` – ${i.r}` : "")).join("; "),
  reason: "", mode: "",
});
function wBox(b) {
  const wi = warrantyInfo(b);
  if (!wi || b.status === "cancelled") return "";
  const w = b.warranty || {};
  if (wi.state !== "pending") {
    const r = b.warrantyReview;
    return `<div class="wr ${wi.state === "approved" ? "ok" : "bad"}">
      <div class="t">${wi.state === "approved" ? "✅ Warranty approved – repair is free" : "❌ Not covered under warranty"}</div>
      ${wi.defect ? `<div class="found">Defect found: ${esc(wi.defect)}</div>` : ""}
      ${wi.reason ? `<div class="found"><b>Reason:</b> ${esc(wi.reason)}</div>` : ""}
      <div class="note">Decided ${when(wi.at)}${wi.by ? " by " + esc(wi.by) : ""} · customer sees this on their tracking link${r?.sentAt ? ` · sent on WhatsApp ${ago(r.sentAt)}` : ""}</div>
      <div class="row"><button class="btn sm wa" data-act="wr-send" data-id="${b.id}">📲 ${r?.sentAt ? "Resend" : "Send"} decision on WhatsApp</button>
        ${b.payment ? "" : `<button class="btn link" data-act="wr-undo" data-id="${b.id}">Change decision</button>`}</div>
    </div>`;
  }
  const d = wDraft(b);
  const faults = (b.preQc?.items || []).filter((i) => i.s === "fault");
  const techCheck = b.preQc?.doneAt
    ? `<div class="found">👨‍🔧 Technician check (${when(b.preQc.doneAt)}): ${faults.length ? faults.map((i) => `<b>${esc(i.l)}</b>${i.r ? ` – ${esc(i.r)}` : ""}`).join("; ") : "no fault found"}${b.preQc.remark ? `<br>Remark: ${esc(b.preQc.remark)}` : ""}</div>`
    : `<div class="note">Technician hasn't checked the device yet – you can decide from the photo / description, or wait for the pre-repair check.</div>`;
  return `<div class="wr">
    <div class="t">🛡️ Warranty check – is this covered?</div>
    <div class="found">Customer says: ${esc(b.problem || "—")}${w.since ? ` · since ${esc(w.since)}` : ""}${w.photo ? ` · <a href="${esc(w.photo)}" target="_blank" rel="noopener">📷 photo</a>` : ""}${w.origBookingId ? ` · <a href="${invoiceUrl(w.origBookingId)}" target="_blank" rel="noopener">original repair & QC</a>` : w.invoiceNo || w.origCode ? ` · original ${esc(w.invoiceNo || w.origCode)}` : ""}</div>
    ${techCheck}
    <label for="wd-${b.id}">Defect / abnormality found</label>
    <textarea class="in" id="wd-${b.id}" data-wr="defect" data-id="${b.id}" placeholder="e.g. Display flickering – same part we replaced">${esc(d.defect)}</textarea>
    ${d.mode === "reject" ? `
      <label>Why is it not covered? (customer will see this)</label>
      <div class="reasons">${W_REASONS.map((x) => `<button class="${d.reason === x ? "on" : ""}" data-act="wr-reason" data-id="${b.id}" data-r="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <textarea class="in" id="wr-${b.id}" data-wr="reason" data-id="${b.id}" placeholder="Write the reason in simple words">${esc(d.reason)}</textarea>
      <div class="row"><button class="btn sm r" data-act="wr-reject" data-id="${b.id}">❌ Confirm – not covered</button><button class="btn link" data-act="wr-mode" data-id="${b.id}" data-m="">Back</button></div>`
    : `<div class="row"><button class="btn sm" style="background:var(--green);border-color:var(--green)" data-act="wr-approve" data-id="${b.id}">✅ Approve – covered (free)</button><button class="btn sm r" data-act="wr-mode" data-id="${b.id}" data-m="reject">❌ Not covered</button></div>`}
  </div>`;
}
const wMsg = (b) => {
  const wi = warrantyInfo(b), what = `${b.device ? b.device + " – " : ""}${b.item || b.service}`, id = b.warranty?.claimId || b.code;
  return (wi.state === "approved" ? [
    `Hi ${b.name}, good news! ✅ Your ZippHive warranty claim *${id}* is *APPROVED*.`, ``,
    `🛠️ ${what}`, wi.defect ? `🔍 Defect found: ${wi.defect}` : "",
    `💚 The repair is covered under warranty – you pay ₹0.`, ``,
    `Track your warranty job: ${trackUrl(b.id)}`,
  ] : [
    `Hi ${b.name}, we have checked your ZippHive warranty claim *${id}*.`, ``,
    `🛠️ ${what}`, wi.defect ? `🔍 Found: ${wi.defect}` : "",
    `❌ Sorry, this is *not covered under warranty*.`, `Reason: ${wi.reason}`, ``,
    `We can still repair it at our normal price – reply here and we'll share a quote.`,
    `Details: ${trackUrl(b.id)}`,
  ]).filter((l, i, a) => l !== "" || a[i - 1] !== "").join("\n");
};

// WhatsApp confirmation the store sends once it has received / accepted the booking
const trackMsg = (b) => [
  `Hi ${b.name}, your ZippHive booking *${b.code}* is confirmed ✅`,
  ``,
  `🛠️ ${b.device ? b.device + " – " : ""}${b.item || b.service}${b.price ? ` · ₹${Number(b.price).toLocaleString("en-IN")}` : isWarranty(b) ? " · warranty (free if covered)" : ""}`,
  `📍 ${b.area}, Patna · ${b.time}`,
  b.techName ? `👨‍🔧 Technician: ${b.techName}${b.techPhone ? ` (${b.techPhone})` : ""}` : `👨‍🔧 We're assigning a verified technician now.`,
  b.eta ? `🕒 Expected: ${b.eta}` : "",
  ``,
  `Track your technician live: ${trackUrl(b.id)}`,
  ``,
  `Pay after the work is done – UPI, card or cash. Questions? Just reply here.`,
].filter((l, i, a) => l !== "" || (a[i - 1] !== "" && i > 0)).join("\n");

function techPanel() {
  const rows = S.techs.slice().sort((a, b) => (a.active === false) - (b.active === false) || a.name.localeCompare(b.name)).map((t) => {
    const l = techLoad(t.email);
    let st = `<span class="st free">● Free</span>`;
    if (t.active === false) st = `<span class="st off">Inactive</span>`;
    else if (l.active.length) st = `<span class="st busy">● ${esc(STATUS[l.active[0].status] || "On job")} · ${esc(l.active[0].code)}${l.active.length > 1 ? ` +${l.active.length - 1}` : ""}</span>`;
    if (l.pending.length && t.active !== false) st += ` <span class="st pend">· ${l.pending.length} awaiting accept</span>`;
    return `<div class="tech"><div class="av">${t.photo ? `<img src="${esc(t.photo)}" alt="">` : "👨‍🔧"}</div>
      <div style="flex:1;min-width:0"><div class="nm">${esc(t.name)}</div>${st}<div class="muted" style="font-size:12px">${esc(t.skills || "")}</div></div>
      ${t.phone ? `<a class="btn sm g" href="tel:${esc(t.phone)}" aria-label="Call ${esc(t.name)}">📞</a>` : ""}</div>`;
  }).join("");
  return `<div class="card side"><h2>Technicians <button class="btn link" data-act="reload">Refresh</button></h2>
    ${rows || `<p class="muted">No technicians yet. Add them in <a href="/admin.html">Admin → Technicians</a>.</p>`}
    <p class="muted" style="margin:10px 0 0">Technicians sign in at <b>/tech.html</b> to accept jobs.</p></div>`;
}

function managerPanel() {
  if (!isAdmin()) return "";
  const rows = S.managers.map((m) => `<div class="tech"><div class="av">🧑‍💼</div><div style="flex:1;min-width:0"><div class="nm">${esc(m.name || m.email)}</div><div class="muted" style="font-size:12px">${esc(m.email)}</div></div><button class="btn sm r" data-act="delmgr" data-email="${esc(m.email)}">Remove</button></div>`).join("");
  return `<div class="card side"><h2>Store managers</h2>
    ${rows || `<p class="muted">Only admins so far.</p>`}
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
      <input class="in" id="mgr-name" placeholder="Name">
      <input class="in" id="mgr-email" placeholder="Google email (Gmail)">
      <button class="btn sm" data-act="addmgr">Add store manager</button>
    </div></div>`;
}

function dashboard() {
  const c = counts();
  const v = visible();
  const n = (f) => (S.bookings || []).filter((b) => {
    const s = stage(b);
    return f === "action" ? needsAction(b) : f === "waiting" ? s === "waiting" : f === "active" ? s === "active" : false;
  }).length;
  const chip = (f, label, count) => `<button class="chip ${S.filter === f ? "on" : ""}" data-act="filter" data-f="${f}">${label}${count != null ? `<em>${count}</em>` : ""}</button>`;
  const kpi = (cls, f, num, label, sub = "") => `<button class="kpi ${cls} ${S.filter === f ? "sel" : ""}" data-act="filter" data-f="${f}"><b>${num}</b><span>${label}</span>${sub ? `<small>${sub}</small>` : ""}</button>`;
  return `
  <header class="top"><span class="brand">Zipp<span>Hive</span></span><span class="role">Store Manager</span><span class="live"><i></i>Live</span>
    <span class="sp"></span><a class="btn sm ghost" href="/slots.html">📅 Time slots</a><span class="who">${esc(S.user.email)}</span><button class="btn sm ghost" data-act="signout">Sign out</button></header>
  <div class="wrap">
    <div class="kpis">
      ${kpi("k-new", "action", c.new, "New bookings")}
      ${kpi("k-need", "action", c.need, "Need a technician")}
      ${kpi("k-wait", "waiting", c.wait, "Waiting for accept")}
      ${kpi("k-act", "active", c.act, "On the job")}
      ${kpi("k-done", "done", c.done, "Completed today")}
      ${kpi("k-cash", "done", rupees(c.cash), "Collected today", [Object.entries(c.modes).map(([m, v]) => `${m} ${rupees(v)}`).join(" · "), c.unpaid ? `${c.unpaid} unpaid` : "", c.free ? `${c.free} free` : ""].filter(Boolean).join(" · "))}
    </div>
    <div class="layout">
      <main>
        <div class="bar">
          ${chip("action", "Needs action", n("action"))}${chip("waiting", "Waiting", n("waiting"))}${chip("active", "In progress", n("active"))}${chip("done", "Completed")}${chip("warranty", "🛡️ Warranty", (S.bookings || []).filter((b) => isWarranty(b) && !CLOSED.includes(b.status)).length)}${chip("cancelled", "Cancelled")}${chip("all", "All")}
          <input class="in" id="q" placeholder="Search name, mobile, code…" value="${esc(S.q)}" aria-label="Search bookings">
        </div>
        ${S.bookings === null ? `<div class="card empty">Loading bookings…</div>` : v.length ? v.map(card).join("") : `<div class="card empty">${S.filter === "action" ? "All caught up — nothing needs you right now." : "Nothing here."}</div>`}
      </main>
      <aside>${techPanel()}${managerPanel()}</aside>
    </div>
  </div>`;
}

function render() {
  const a = document.activeElement;
  const focusId = a && a.id;
  const sel = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  const openDetails = [...app.querySelectorAll("details[open]")].map((d) => d.closest(".bk")?.querySelector("[data-pick]")?.dataset.pick);

  if (S.be === undefined || S.user === undefined) app.innerHTML = `<div class="center muted">Loading…</div>`;
  else if (S.be === null) app.innerHTML = `<div class="center"><div><h2>Not configured</h2><p class="muted">Firebase settings are missing in zipphive-config.js.</p></div></div>`;
  else if (!S.user) app.innerHTML = `<header class="top"><span class="brand">Zipp<span>Hive</span></span><span class="role">Store Manager</span></header>
    <div class="card login"><h2>Store manager sign-in</h2><p class="muted">Use the Google account your admin added.</p><button class="btn" data-act="signin">Sign in with Google</button></div>`;
  else if (!S.ok) app.innerHTML = `<header class="top"><span class="brand">Zipp<span>Hive</span></span><span class="sp"></span><button class="btn sm ghost" data-act="signout">Sign out</button></header>
    <div class="card login"><h2>Not authorised</h2><p class="muted">${esc(S.user.email)} is not a ZippHive store manager. Ask the admin to add you.</p></div>`;
  else app.innerHTML = dashboard();

  openDetails.forEach((id) => id && document.getElementById("pick-" + id)?.closest("details")?.setAttribute("open", ""));
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} }
  }
}

let deferred = false;
function softRender() {
  const a = document.activeElement;
  if (a && a.tagName === "SELECT" && app.contains(a)) { deferred = true; return; }
  render();
}
app.addEventListener("focusout", () => setTimeout(() => { if (deferred) { deferred = false; softRender(); } }, 0));

// New-booking alert: chime + tab title, since website bookings land here directly (not on WhatsApp)
let seenNew = null, actx = null;
function chime() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18, 0.36].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = [660, 880, 990][i]; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.22, actx.currentTime + d); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d + 0.25);
      o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.27);
    });
  } catch {}
}
function alertNew(list) {
  const fresh = list.filter((b) => b.status === "new");
  const ids = new Set(fresh.map((b) => b.id));
  if (seenNew) {
    const added = fresh.filter((b) => !seenNew.has(b.id));
    if (added.length) {
      chime();
      toast(`🔔 New booking: ${added[0].name} · ${added[0].device ? added[0].device + " – " : ""}${added[0].item || added[0].service}`);
      try { if (document.hidden && Notification.permission === "granted") new Notification("New ZippHive booking", { body: `${added[0].name} · ${added[0].area}`, icon: "/zh-icon.png" }); } catch {}
    }
  }
  seenNew = ids;
  document.title = ids.size ? `(${ids.size}) New booking – ZippHive Manager` : "ZippHive Store Manager";
}
document.addEventListener("click", () => {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch {}
}, { once: true });

const find = (id) => (S.bookings || []).find((b) => b.id === id);
const run = (p, ok) => p.then(() => ok && toast(ok)).catch((e) => toast("Failed: " + (e.message || e), true));
const loadTechs = () => S.be.listTechs().then((t) => { S.techs = t; softRender(); }).catch(() => {});
const loadMgrs = () => isAdmin() && S.be.listManagers().then((m) => { S.managers = m; render(); }).catch(() => {});

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, b = find(el.dataset.id);
  if (act === "signin") return S.be.signIn().catch((x) => toast("Sign-in failed: " + (x.message || x), true));
  if (act === "signout") return S.be.signOut();
  if (act === "filter") { S.filter = el.dataset.f; return render(); }
  if (act === "reload") return loadTechs();
  if (act === "addmgr") {
    const email = document.getElementById("mgr-email").value.trim().toLowerCase();
    const name = document.getElementById("mgr-name").value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Enter a valid Google email", true);
    return run(S.be.saveManager({ email, name, addedAt: Date.now() }), "Store manager added").then(loadMgrs);
  }
  if (act === "delmgr") return confirm(`Remove ${el.dataset.email}?`) && run(S.be.deleteManager(el.dataset.email), "Removed").then(loadMgrs);
  if (!b) return;
  if (act === "confirm") return run(actions.confirm(S.be, b), `${b.code} confirmed`);
  if (act === "confirm-wa") {
    // open WhatsApp first (must happen inside the click), then mark the booking confirmed + message sent
    window.open(waLink(b.mobile, trackMsg(b)), "_blank", "noopener");
    const patch = { confirmSentAt: Date.now() };
    if (b.status === "new") Object.assign(patch, { status: "confirmed", statusAt: Date.now() });
    pingSheet();
    return run(S.be.updateBooking(b.id, patch), b.status === "new" ? `${b.code} confirmed – WhatsApp opened` : "WhatsApp opened");
  }
  if (act === "send") {
    const email = S.draft.pick[b.id];
    const t = S.techs.find((x) => x.email === email);
    if (!t) return toast("Choose a technician first", true);
    delete S.draft.pick[b.id];
    return run(actions.offer(S.be, b, t), `Sent to ${t.name} — waiting for them to accept`);
  }
  if (act === "unassign") return run(actions.unassign(S.be, b), "Job taken back");
  if (act === "eta") { const v = S.draft.eta[b.id] ?? b.eta ?? ""; delete S.draft.eta[b.id]; return run(actions.setEta(S.be, b, v), "ETA saved — customer can see it"); }
  if (act.startsWith("wr-")) {
    const d = wDraft(b);
    if (act === "wr-mode") { d.mode = el.dataset.m; return render(); }
    if (act === "wr-reason") { d.reason = el.dataset.r; return render(); }
    const by = S.managers.find((m) => m.email === S.user.email)?.name || S.user.displayName || S.user.email;
    if (act === "wr-approve") {
      if (!d.defect.trim()) { document.getElementById("wd-" + b.id)?.focus(); return toast("Write the defect / abnormality you found", true); }
      pingSheet();
      return run(actions.reviewWarranty(S.be, b, { decision: "approved", defect: d.defect.trim(), reason: "", at: Date.now(), by }), "Warranty approved – send it to the customer on WhatsApp");
    }
    if (act === "wr-reject") {
      if (!d.reason.trim()) { document.getElementById("wr-" + b.id)?.focus(); return toast("Choose or write the reason it's not covered", true); }
      pingSheet();
      return run(actions.reviewWarranty(S.be, b, { decision: "rejected", defect: d.defect.trim(), reason: d.reason.trim(), at: Date.now(), by }), "Marked not covered – send it to the customer on WhatsApp");
    }
    if (act === "wr-send") {
      window.open(waLink(b.mobile, wMsg(b)), "_blank", "noopener");
      return run(S.be.updateBooking(b.id, { warrantyReview: { ...b.warrantyReview, sentAt: Date.now() } }), "WhatsApp opened");
    }
    if (act === "wr-undo") {
      if (!confirm(`Re-open the warranty decision for ${b.code}?`)) return;
      const r = b.warrantyReview || {};
      S.draft.wr[b.id] = { defect: r.defect || "", reason: r.reason || "", mode: r.decision === "rejected" ? "reject" : "" };
      pingSheet();
      return run(actions.reviewWarranty(S.be, b, null), "Decision re-opened");
    }
  }
  if (act === "cancel") return confirm(`Cancel booking ${b.code} for ${b.name}?`) && run(actions.cancel(S.be, b), "Booking cancelled");
  if (act === "copy") return navigator.clipboard?.writeText(trackUrl(b.id)).then(() => toast("Tracking link copied"));
});
app.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset?.sheet) d.open ? S.sheets.add(d.dataset.sheet) : S.sheets.delete(d.dataset.sheet); }, true);
app.addEventListener("change", (e) => { if (e.target.dataset.pick) S.draft.pick[e.target.dataset.pick] = e.target.value; });
app.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q = e.target.value; render(); }
  else if (e.target.dataset.eta) S.draft.eta[e.target.dataset.eta] = e.target.value;
  else if (e.target.dataset.wr) { const b = find(e.target.dataset.id); if (b) wDraft(b)[e.target.dataset.wr] = e.target.value; }
});
setInterval(() => S.ok && softRender(), 30000);
setInterval(() => S.ok && loadTechs(), 120000);

S.be = await backend();
render();
if (S.be) S.be.onUser(async (u) => {
  unsub && unsub(); unsub = null;
  S.user = u; S.ok = false; S.bookings = null;
  if (u) {
    S.ok = await S.be.isManager(u.email);
    if (S.ok) {
      unsub = S.be.watchAllBookings((list) => { S.bookings = list; alertNew(list); softRender(); }, (err) => toast("Could not load bookings: " + (err.message || err), true));
      loadTechs(); loadMgrs();
    }
  }
  render();
});
</script>
</body>
</html>
